<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <title>Dossier Cover Letter</title>
    <style>
        @page {
            size: A4;
            margin: 0;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body,
        div,
        span,
        applet,
        object,
        iframe,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        p,
        blockquote,
        pre,
        a,
        abbr,
        acronym,
        address,
        big,
        cite,
        code,
        del,
        dfn,
        em,
        font,
        img,
        ins,
        kbd,
        q,
        s,
        samp,
        small,
        strike,
        strong,
        sub,
        sup,
        tt,
        var,
        b,
        u,
        i,
        center,
        dl,
        dt,
        dd,
        ol,
        ul,
        li,
        fieldset,
        form,
        label,
        legend,
        table,
        caption,
        tbody,
        tfoot,
        thead,
        tr,
        th,
        td {
            background: transparent;
            border: 0;
            font-size: 100%;
            margin: 0;
            outline: 0;
            padding: 0;
            vertical-align: baseline;
            text-rendering: optimizeLegibility;
        }

        body {
            margin: 0;
            font-family: "Inter", sans-serif;
        }

        .cover_resume {
            width: 794px;
            min-height: 800px;
            margin: 0 auto;
            background: #EAE9E7;
            overflow: hidden;
            border-radius: 8px;
            padding: 30px 30px 80px;
            position: relative;
        }

        .header {
            display: flex;
            flex-direction: column;
            row-gap: 20px;
        }

        .header .header_top {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
        }

        .header .header_left {
            width: 152px;
            line-height: 0;
        }

        .header .header_left img {
            width: 100%;
            height: 134px;
            border-radius: 10px;
            object-fit: cover;
            object-position: top;
        }

        .header .header_right h1 {
            font-weight: 700;
            font-size: 42px;
            line-height: 100%;
            color: #000000;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .header .header_right h4 {
            font-weight: 500;
            font-size: 22px;
            line-height: 100%;
            color: #000000;
        }

        .header .header_bottom {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            border: 1px solid #000000;
            border-radius: 30px;
            padding: 14px 25px;
            row-gap: 10px;
        }

        .header .header_details {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header .header_details a,
        .header .header_details p {
            font-weight: 400;
            font-style: Italic;
            font-size: 16px;
            line-height: 100%;
            display: inline-block;
            text-decoration: none;
            color: #000000;
        }

        .cover_resume_content {
            margin-top: 40px;
        }

        .cover_resume_content h2 {
            font-weight: 500;
            font-size: 20px;
            line-height: 100%;
            color: #000000;
            border: 1px solid #000000;
            width: fit-content;
            border-radius: 30px;
            padding: 10px 25px;
            margin-bottom: 20px;
            text-transform: capitalize;
        }

        .cover_resume_content .cover_resume_summary {
            display: flex;
            flex-direction: column;
            row-gap: 20px;
        }

        .cover_resume_content .cover_resume_summary p {
            font-weight: 400;
            font-size: 16px;
            line-height: 26px;
            color: #000000;
            display: inline-block;
        }

        .cover_resume_content .cover_resume_bottom {
            margin-top: 100px;
        }

        .cover_resume_content .cover_resume_bottom p {
            font-weight: 400;
            font-size: 16px;
            line-height: 100%;
            color: #000000;
            display: inline-block;
            margin-bottom: 15px;
        }

        .cover_resume_content .cover_resume_bottom h5 {
            font-weight: 600;
            font-size: 20px;
            line-height: 26px;
            color: #000000;
            text-transform: capitalize;
        }

        .cover_resume .cover_resume_svg {
            position: absolute;
            right: 0;
            bottom: 0;
            line-height: 0;
        }
    </style>
</head>

<body>
    <div class="cover_resume">
        <div class="header">
            <div class="header_top">
                <div class="header_left">
                    {{photo}}
                </div>
                <div class="header_right">
                    <h1>{{fullName}}</h1>
                    {{tagline}}
                </div>
            </div>
            <div class="header_bottom">
                {{contact}}
            </div>
        </div>
        <div class="cover_resume_content">
            <h2>{{greeting}}</h2>
            <div class="cover_resume_summary">
                {{summary}}
            </div>
            <div class="cover_resume_bottom">
                <p>Sincerely,</p>
                {{signoff}}
            </div>
        </div>
        <div class="cover_resume_svg">

            </svg>
        </div>
    </div>
</body>

</html>
