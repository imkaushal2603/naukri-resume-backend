<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <title>Pewter Cover Letter</title>
    <style>
        @page {
            size: A4;
            margin: 0;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body,
        div,
        span,
        applet,
        object,
        iframe,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        p,
        blockquote,
        pre,
        a,
        abbr,
        acronym,
        address,
        big,
        cite,
        code,
        del,
        dfn,
        em,
        font,
        img,
        ins,
        kbd,
        q,
        s,
        samp,
        small,
        strike,
        strong,
        sub,
        sup,
        tt,
        var,
        b,
        u,
        i,
        center,
        dl,
        dt,
        dd,
        ol,
        ul,
        li,
        fieldset,
        form,
        label,
        legend,
        table,
        caption,
        tbody,
        tfoot,
        thead,
        tr,
        th,
        td {
            background: transparent;
            border: 0;
            font-size: 100%;
            margin: 0;
            outline: 0;
            padding: 0;
            vertical-align: baseline;
            text-rendering: optimizeLegibility;
        }

        body {
            margin: 0;
            font-family: "Inter", sans-serif;
        }

        .cover_resume {
            width: 794px;
            min-height: 800px;
            margin: 0 auto;
            background: #C6C6C6;
            overflow: hidden;
            border-radius: 8px;
            position: relative;
        }

        .bg_svg {
            position: absolute;
            line-height: 0;
            inset: 0;
            pointer-events: none;
        }

        .header {
            padding: 70px 0 25px;
            display: flex;
            flex-wrap: wrap;
            background: #CDCDCD;
        }

        .header .header_left {
            width: calc(100% - 235px);
        }

        .header .header_top {
            padding: 0 70px;
        }

        .header .header_right {
            width: 235px;
            line-height: 0;
        }

        .header .header_right img {
            width: 165px;
            height: 284px;
            object-fit: cover;
            border-radius: 120px;
            object-position: top;
        }

        .header h1 {
            font-weight: 600;
            font-size: 46px;
            line-height: 100%;
            color: #000000;
            margin-bottom: 15px;
            text-transform: capitalize;
            word-break: break-word;
        }

        .header h4 {
            font-weight: 500;
            font-size: 20px;
            line-height: 100%;
            color: #000000;
        }

        .header .header_svg {
            line-height: 0;
            padding: 20px 0;
        }

        .header .header_bottom {
            border-left: 1px solid #000000;
            display: flex;
            flex-direction: column;
            row-gap: 15px;
            padding-left: 10px;
            margin: 0 70px;
        }

        .header .header_details a,
        .header .header_details p {
            font-weight: 500;
            font-size: 16px;
            line-height: 100%;
            display: inline-block;
            text-decoration: none;
            color: #000000;
        }

        .cover_resume_content {
            padding: 30px 70px 90px;
            position: relative;
        }

        .cover_resume_content h2 {
            font-weight: 500;
            font-size: 20px;
            line-height: 100%;
            color: #000000;
            margin-bottom: 15px;
            text-transform: capitalize;
        }

        .cover_resume_content .cover_resume_summary {
            display: flex;
            flex-direction: column;
            row-gap: 15px;
        }

        .cover_resume_content .cover_resume_summary p {
            font-weight: 400;
            font-size: 16px;
            line-height: 26px;
            display: inline-block;
            color: #000000;
        }

        .cover_resume_content .cover_resume_bottom {
            margin-top: 50px;
        }

        .cover_resume_content .cover_resume_bottom p {
            font-weight: 400;
            font-size: 16px;
            line-height: 100%;
            color: #000000;
            display: inline-block;
            margin-bottom: 15px;
        }

        .cover_resume_content .cover_resume_bottom h5 {
            font-weight: 600;
            font-size: 20px;
            line-height: 26px;
            color: #000000;
            text-transform: capitalize;
        }
    </style>
</head>

<body>
    <div class="cover_resume">
        <div class="bg_svg">
            <svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 794 1123" fill="none"
                preserveAspectRatio="none">
                <path d="M754.5 0L754.5 1123" stroke="black" />
                <path d="M0 39.5H794" stroke="black" />
                <path d="M0 1082.5H794" stroke="black" />
                <path d="M41.0039 -0.0180664L41.0039 1122.98" stroke="black" />
                <path
                    d="M42.8231 39.7544L50.375 39L42.8231 38.2447L47.6294 32.3706L41.755 37.1772L41 29.625L40.2447 37.1772L34.3706 32.3706L39.1769 38.2447L31.625 39L39.1769 39.7544L34.3706 45.6291L40.2447 40.8231L41 48.375L41.755 40.8231L47.6294 45.6291L42.8231 39.7544Z"
                    fill="black" />
                <path
                    d="M42.8231 1082.75L50.375 1082L42.8231 1081.24L47.6294 1075.37L41.755 1080.18L41 1072.62L40.2447 1080.18L34.3706 1075.37L39.1769 1081.24L31.625 1082L39.1769 1082.75L34.3706 1088.63L40.2447 1083.82L41 1091.38L41.755 1083.82L47.6294 1088.63L42.8231 1082.75Z"
                    fill="black" />
                <path
                    d="M755.823 39.7544L763.375 39L755.823 38.2447L760.629 32.3706L754.755 37.1772L754 29.625L753.245 37.1772L747.371 32.3706L752.177 38.2447L744.625 39L752.177 39.7544L747.371 45.6291L753.245 40.8231L754 48.375L754.755 40.8231L760.629 45.6291L755.823 39.7544Z"
                    fill="black" />
                <path
                    d="M756.823 1082.75L764.375 1082L756.823 1081.24L761.629 1075.37L755.755 1080.18L755 1072.62L754.245 1080.18L748.371 1075.37L753.177 1081.24L745.625 1082L753.177 1082.75L748.371 1088.63L754.245 1083.82L755 1091.38L755.755 1083.82L761.629 1088.63L756.823 1082.75Z"
                    fill="black" />
            </svg>
        </div>
        <div class="header">
            <div class="header_left">
                <div class="header_top">
                    <h1>{{fullName}}</h1>
                    {{tagline}}
                </div>
                <div class="header_svg">
                    <svg xmlns="http://www.w3.org/2000/svg" width="100%" height="21" viewBox="0 0 560 21" fill="none"
                        preserveAspectRatio="none">
                        <path d="M-0.015625 9.875L559.017 9.875" stroke="black" />
                        <path
                            d="M41.8231 10.1294L49.375 9.375L41.8231 8.61969L46.6294 2.74563L40.755 7.55219L40 0L39.2447 7.55219L33.3706 2.74563L38.1769 8.61969L30.625 9.375L38.1769 10.1294L33.3706 16.0041L39.2447 11.1981L40 18.75L40.755 11.1981L46.6294 16.0041L41.8231 10.1294Z"
                            fill="black" />
                    </svg>
                </div>
                <div class="header_bottom">
                    {{contact}}
                </div>
            </div>
            <div class="header_right">
                {{photo}}
            </div>
        </div>
        <div class="cover_resume_content">
            <h2>{{greeting}}</h2>
            <div class="cover_resume_summary">
                {{summary}}
            </div>
            <div class="cover_resume_bottom">
                <p>Sincerely,</p>
                {{signoff}}
            </div>
        </div>
    </div>
</body>

</html>
