<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Courier New', monospace;
            color: #222;
            padding: 70px 80px;
            line-height: 1.6;
            font-size: 13px;
        }

        .header {
            margin-bottom: 35px;
            border-bottom: 1px solid #222;
            padding-bottom: 15px;
        }

        .name {
            font-size: 20px;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .contact-line {
            font-size: 12px;
            color: #555;
        }

        .date {
            margin-bottom: 20px;
            font-size: 12px;
            color: #555;
        }

        .recipient {
            margin-bottom: 22px;
            font-size: 12px;
        }

        .greeting {
            margin-bottom: 16px;
        }

        .body-text {
            white-space: pre-wrap;
            margin-bottom: 22px;
        }

        .closing {
            margin-top: 22px;
        }

        .signature {
            margin-top: 35px;
        }
    </style>
</head>

<body>
    <div class="header">
        <div class="name">{{fullName}}</div>
        <div class="contact-line">{{contactLine}}</div>
    </div>
    <div class="date">{{today}}</div>
    <div class="recipient">{{recipientBlock}}</div>
    <div class="greeting">{{greeting}}</div>
    <div class="body-text">{{summary}}</div>
    <div class="closing">{{closingBody}}</div>
    <div class="signature">&mdash; {{fullName}}</div>
</body>

</html>
