<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <title>Bluebell Cover Letter</title>
    <style>
        @page {
            size: A4;
            margin: 0;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body,
        div,
        span,
        applet,
        object,
        iframe,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        p,
        blockquote,
        pre,
        a,
        abbr,
        acronym,
        address,
        big,
        cite,
        code,
        del,
        dfn,
        em,
        font,
        img,
        ins,
        kbd,
        q,
        s,
        samp,
        small,
        strike,
        strong,
        sub,
        sup,
        tt,
        var,
        b,
        u,
        i,
        center,
        dl,
        dt,
        dd,
        ol,
        ul,
        li,
        fieldset,
        form,
        label,
        legend,
        table,
        caption,
        tbody,
        tfoot,
        thead,
        tr,
        th,
        td {
            background: transparent;
            border: 0;
            font-size: 100%;
            margin: 0;
            outline: 0;
            padding: 0;
            vertical-align: baseline;
            text-rendering: optimizeLegibility;
        }

        body {
            margin: 0;
            font-family: "Inter", sans-serif;
        }

        .cover_resume {
            width: 794px;
            min-height: 800px;
            margin: 0 auto;
            background: #fff;
            overflow: hidden;
            border-radius: 8px;
            padding: 60px 40px 220px;
            position: relative;
            border: 1px solid #7294FF;
        }

        .header h1 {
            font-weight: 600;
            font-style: Italic;
            font-size: 42px;
            line-height: 100%;
            color: #4467B2;
            margin-bottom: 15px;
            text-transform: capitalize;
        }

        .header h4 {
            font-weight: 500;
            font-size: 20px;
            line-height: 100%;
            color: #4467B2;
            margin-bottom: 30px;
        }

        .header .header_content {
            display: flex;
            flex-direction: column;
            row-gap: 15px;
        }

        .header .header_details a,
        .header .header_details p {
            font-weight: 500;
            font-size: 14px;
            line-height: 100%;
            color: #4467B2;
            display: inline-block;
            text-decoration: none;
        }

        .cover_resume_content {
            margin-top: 40px;
        }

        .cover_resume_content h2 {
            font-weight: 600;
            font-size: 18px;
            line-height: 26px;
            color: #4467B2;
            margin-bottom: 15px;
            text-transform: capitalize;
        }

        .cover_resume_content .cover_resume_summary {
            display: flex;
            flex-direction: column;
            row-gap: 15px;
        }

        .cover_resume_content .cover_resume_summary p {
            font-weight: 400;
            font-size: 16px;
            line-height: 26px;
            display: inline-block;
            color: #4467B2;
        }

        .cover_resume_content .cover_resume_bottom {
            margin-top: 60px;
        }

        .cover_resume_content .cover_resume_bottom p {
            font-weight: 400;
            font-size: 16px;
            line-height: 100%;
            color: #4467B2;
            margin-bottom: 15px;
        }

        .cover_resume_content .cover_resume_bottom h5 {
            font-weight: 600;
            font-size: 20px;
            line-height: 26px;
            color: #4467B2;
            text-transform: capitalize;
        }

        .top_svg {
            line-height: 0;
            position: absolute;
            right: 0;
            top: 0;
        }

        .bottom_svg {
            line-height: 0;
            position: absolute;
            left: 0;
            bottom: 0;
        }
    </style>
</head>

<body>
    <div class="cover_resume">
        <div class="top_svg">
            <svg xmlns="http://www.w3.org/2000/svg" width="217" height="180" viewBox="0 0 217 180" fill="none">
                <path
                    d="M143.002 -19.9991C156.134 -19.9991 169.138 -17.4125 181.27 -12.3871C193.403 -7.3616 204.427 0.00434875 213.713 9.29021C222.998 18.5761 230.364 29.6 235.39 41.7325C240.415 53.8651 243.002 66.8687 243.002 80.0009C243.002 93.1331 240.415 106.137 235.39 118.269C230.364 130.402 222.998 141.426 213.713 150.712C204.427 159.997 193.403 167.363 181.27 172.389C169.138 177.414 156.134 180.001 143.002 180.001L143.002 80.0009L143.002 -19.9991Z"
                    fill="url(#paint0_linear_1534_640)" />

                    fill="url(#paint1_linear_1534_640)" />
                <circle cx="65" cy="80.0009" r="65" transform="rotate(-90 65 80.0009)"
                    fill="url(#paint2_linear_1534_640)" />
                <defs>
                    <linearGradient id="paint0_linear_1534_640" x1="209.5" y1="80.0009" x2="43.002" y2="80.0009"
                        gradientUnits="userSpaceOnUse">
                        <stop stop-color="#7294FF" />
                        <stop offset="1" stop-color="white" />
                    </linearGradient>
                    <linearGradient id="paint1_linear_1534_640" x1="147.523" y1="80.0009" x2="6" y2="80.0009"
                        gradientUnits="userSpaceOnUse">
                        <stop stop-color="#7294FF" />
                        <stop offset="1" stop-color="white" />
                    </linearGradient>
                    <linearGradient id="paint2_linear_1534_640" x1="65" y1="123.225" x2="65" y2="15.0009"
                        gradientUnits="userSpaceOnUse">
                        <stop stop-color="#7294FF" />
                        <stop offset="1" stop-color="white" />
                    </linearGradient>
                </defs>
            </svg>
        </div>
        <div class="header">
            <h1>{{fullName}}</h1>
            {{tagline}}
            <div class="header_content">
                {{contact}}
            </div>
        </div>
        <div class="cover_resume_content">
            <h2>{{greeting}}</h2>
            <div class="cover_resume_summary">
                {{summary}}
            </div>
            <div class="cover_resume_bottom">
                <p>Sincerely,</p>
                {{signoff}}
            </div>
        </div>
        <div class="bottom_svg">
            <svg xmlns="http://www.w3.org/2000/svg" width="219" height="179" viewBox="0 0 219 179" fill="none">
                <path
                    d="M76 200C62.8678 200 49.8642 197.413 37.7317 192.388C25.5991 187.362 14.5752 179.997 5.28932 170.711C-3.99654 161.425 -11.3625 150.401 -16.388 138.268C-21.4134 126.136 -24 113.132 -24 100C-24 86.8678 -21.4134 73.8642 -16.388 61.7317C-11.3625 49.5991 -3.99654 38.5752 5.28932 29.2893C14.5752 20.0035 25.5991 12.6375 37.7317 7.61204C49.8642 2.58657 62.8678 -1.14805e-06 76 0L76 100L76 200Z"
                    fill="url(#paint0_linear_1534_639)" />
                <path
                    d="M128.002 185C116.84 185 105.787 182.801 95.4739 178.53C85.1612 174.258 75.7908 167.997 67.8979 160.104C60.0049 152.211 53.7438 142.841 49.4722 132.528C45.2005 122.215 43.002 111.162 43.002 100C43.002 88.8376 45.2005 77.7846 49.4722 67.4719C53.7439 57.1592 60.0049 47.7889 67.8979 39.8959C75.7909 32.0029 85.1612 25.7419 95.4739 21.4702C105.787 17.1986 116.84 15 128.002 15L128.002 100V185Z"
                    fill="url(#paint1_linear_1534_639)" />
                <circle cx="154.002" cy="100" r="65" transform="rotate(90 154.002 100)"
                    fill="url(#paint2_linear_1534_639)" />
                <defs>
                    <linearGradient id="paint0_linear_1534_639" x1="9.50195" y1="100" x2="176" y2="100"
                        gradientUnits="userSpaceOnUse">
                        <stop stop-color="#7294FF" />
                        <stop offset="1" stop-color="white" />
                    </linearGradient>
                    <linearGradient id="paint1_linear_1534_639" x1="71.4786" y1="100" x2="213.002" y2="100"
                        gradientUnits="userSpaceOnUse">
                        <stop stop-color="#7294FF" />
                        <stop offset="1" stop-color="white" />
                    </linearGradient>
                    <linearGradient id="paint2_linear_1534_639" x1="154.002" y1="143.224" x2="154.002" y2="35"
                        gradientUnits="userSpaceOnUse">
                        <stop stop-color="#7294FF" />
                        <stop offset="1" stop-color="white" />
                    </linearGradient>
                </defs>
            </svg>
        </div>
    </div>
</body>

</html>
