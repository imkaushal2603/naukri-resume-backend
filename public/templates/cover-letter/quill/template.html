<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <title>Quill Cover Letter</title>
    <style>
        @page {
            size: A4;
            margin: 0;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body,
        div,
        span,
        applet,
        object,
        iframe,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        p,
        blockquote,
        pre,
        a,
        abbr,
        acronym,
        address,
        big,
        cite,
        code,
        del,
        dfn,
        em,
        font,
        img,
        ins,
        kbd,
        q,
        s,
        samp,
        small,
        strike,
        strong,
        sub,
        sup,
        tt,
        var,
        b,
        u,
        i,
        center,
        dl,
        dt,
        dd,
        ol,
        ul,
        li,
        fieldset,
        form,
        label,
        legend,
        table,
        caption,
        tbody,
        tfoot,
        thead,
        tr,
        th,
        td {
            background: transparent;
            border: 0;
            font-size: 100%;
            margin: 0;
            outline: 0;
            padding: 0;
            vertical-align: baseline;
            text-rendering: optimizeLegibility;
        }

        body {
            margin: 0;
            font-family: "Inter", sans-serif;
        }

        .cover_resume {
            width: 794px;
            min-height: 800px;
            margin: 0 auto;
            background: #fff;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #D9E3E9;
        }

        .header {
            background: #D9E3E9;
            padding: 20px 30px;
            display: flex;
            flex-direction: column;
            row-gap: 10px;
        }

        .header .header_top {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
        }

        .header_top h1 {
            font-weight: 600;
            font-size: 26px;
            line-height: 100%;
            color: #000000;
            text-transform: capitalize;
        }

        .header_top h4 {
            font-weight: 400;
            font-style: Italic;
            font-size: 14px;
            line-height: 100%;
            color: #000000;
            display: inline-block;
        }

        .header_bottom {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 20px;
        }

        .header_bottom .header_details {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .header_bottom .header_details p,
        .header_bottom .header_details a {
            font-weight: 400;
            font-size: 14px;
            line-height: 100%;
            display: inline-block;
            color: #000000;
            text-decoration: none;
        }

        .cover_resume_content {
            padding: 30px;
            padding-bottom: 60px;
        }

        .cover_resume_content h2 {
            font-weight: 500;
            font-size: 20px;
            line-height: 100%;
            color: #000000;
            margin-bottom: 15px;
            text-transform: capitalize;
        }

        .cover_resume_content .cover_resume_summary {
            display: flex;
            flex-direction: column;
            row-gap: 15px;
        }

        .cover_resume_content .cover_resume_summary p {
            font-weight: 400;
            font-size: 16px;
            line-height: 26px;
            display: inline-block;
            color: #000000;
        }

        .cover_resume_content .cover_resume_bottom {
            margin-top: 60px;
        }

        .cover_resume_content .cover_resume_bottom p {
            font-weight: 400;
            font-size: 16px;
            line-height: 26px;
            color: #000000;
            margin-bottom: 10px;
        }

        .cover_resume_content .cover_resume_bottom h5 {
            font-weight: 600;
            font-size: 20px;
            line-height: 26px;
            color: #000000;
            display: inline-block;
            text-transform: capitalize;
        }
    </style>
</head>

<body>
    <div class="cover_resume">
        <div class="header">
            <div class="header_top">
                <h1>{{fullName}}</h1>
                {{tagline}}
            </div>
            <div class="header_bottom">
                {{contact}}
            </div>
        </div>
        <div class="cover_resume_content">
            <h2>{{greeting}}</h2>
            <div class="cover_resume_summary">
                {{summary}}
            </div>
            <div class="cover_resume_bottom">
                <p>Sincerely,</p>
                {{signoff}}
            </div>
        </div>
    </div>
</body>

</html>
