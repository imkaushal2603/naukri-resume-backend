<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <title>Regatta Cover Letter</title>
    <style>
        @page {
            size: A4;
            margin: 0;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body,
        div,
        span,
        applet,
        object,
        iframe,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        p,
        blockquote,
        pre,
        a,
        abbr,
        acronym,
        address,
        big,
        cite,
        code,
        del,
        dfn,
        em,
        font,
        img,
        ins,
        kbd,
        q,
        s,
        samp,
        small,
        strike,
        strong,
        sub,
        sup,
        tt,
        var,
        b,
        u,
        i,
        center,
        dl,
        dt,
        dd,
        ol,
        ul,
        li,
        fieldset,
        form,
        label,
        legend,
        table,
        caption,
        tbody,
        tfoot,
        thead,
        tr,
        th,
        td {
            background: transparent;
            border: 0;
            font-size: 100%;
            margin: 0;
            outline: 0;
            padding: 0;
            vertical-align: baseline;
            text-rendering: optimizeLegibility;
        }

        body {
            margin: 0;
            font-family: "Inter", sans-serif;
        }

        .cover_resume {
            width: 794px;
            min-height: 800px;
            margin: 10px auto;
            background: #fff;
            overflow: hidden;
            border-radius: 8px;
            padding: 40px 20px;
            position: relative;
            border: 1px solid #4467B2;
        }

        .cover_resume::after {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            background: #4467B2;
            height: 100%;
            width: 80px;
        }

        .header {
            display: flex;
            flex-wrap: wrap;
            position: relative;
            z-index: 1;
        }

        .header .header_left {
            width: 300px;
            position: relative;
        }

        .header .header_left img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 50%;
            object-position: top;
            position: relative;
            z-index: 1;
        }

        .header .header_left::after {
            content: "";
            position: absolute;
            right: 20px;
            width: 200px;
            height: 200px;
            background: #4467B2;
            border-radius: 50%;
        }

        .header .header_right {
            width: calc(100% - 300px);
            padding-left: 10px;
        }

        .header .header_right h1 {
            font-weight: 600;
            font-size: 46px;
            line-height: 120%;
            color: #000000;
            margin-bottom: 10px;
            text-transform: capitalize;
        }

        .header .header_right h4 {
            font-weight: 500;
            font-size: 20px;
            line-height: 100%;
            color: #000000;
            margin-bottom: 20px;
            text-transform: capitalize;
        }

        .header .header_content {
            display: flex;
            flex-direction: column;
            row-gap: 15px;
        }

        .header .header_details {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .header .header_details a,
        .header .header_details p {
            font-weight: 500;
            font-size: 16px;
            line-height: 100%;
            color: #4467B2;
            display: inline-block;
            text-decoration: none;
        }

        .cover_resume_content {
            padding-left: 80px;
            padding-top: 40px;
        }

        .cover_resume_content h2 {
            font-weight: 500;
            font-size: 20px;
            line-height: 100%;
            color: #000000;
            margin-bottom: 20px;
            text-transform: capitalize;
        }

        .cover_resume_content .cover_resume_summary {
            display: flex;
            flex-direction: column;
            row-gap: 20px;
        }

        .cover_resume_content .cover_resume_summary p {
            font-weight: 400;
            font-size: 16px;
            line-height: 26px;
            display: inline-block;
            color: #000000;
        }

        .cover_resume_content .cover_resume_bottom {
            margin-top: 40px;
        }

        .cover_resume_content .cover_resume_bottom p {
            font-weight: 400;
            font-size: 16px;
            line-height: 100%;
            display: inline-block;
            color: #000000;
            margin-bottom: 15px;
        }

        .cover_resume_content .cover_resume_bottom h5 {
            font-weight: 600;
            font-size: 20px;
            line-height: 26px;
            color: #000000;
            text-transform: capitalize;
        }
    </style>
</head>

<body>
    <div class="cover_resume">
        <div class="header">
            <div class="header_left">
                {{photo}}
            </div>
            <div class="header_right">
                <h1>{{fullName}}</h1>
                {{tagline}}
                <div class="header_content">
                    {{contact}}
                </div>
            </div>
        </div>
        <div class="cover_resume_content">
            <h2>{{greeting}}</h2>
            <div class="cover_resume_summary">
                {{summary}}
            </div>
            <div class="cover_resume_bottom">
                <p>Sincerely,</p>
                {{signoff}}
            </div>
        </div>
    </div>
</body>

</html>
