<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Granite Resume</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
        rel="stylesheet">
    <style>
        @page {
            size: A4;
            margin: 0;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body,
        div,
        span,
        applet,
        object,
        iframe,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        p,
        blockquote,
        pre,
        a,
        abbr,
        acronym,
        address,
        big,
        cite,
        code,
        del,
        dfn,
        em,
        font,
        img,
        ins,
        kbd,
        q,
        s,
        samp,
        small,
        strike,
        strong,
        sub,
        sup,
        tt,
        var,
        b,
        u,
        i,
        center,
        dl,
        dt,
        dd,
        ol,
        ul,
        li,
        fieldset,
        form,
        label,
        legend,
        table,
        caption,
        tbody,
        tfoot,
        thead,
        tr,
        th,
        td {
            background: transparent;
            border: 0;
            font-size: 100%;
            margin: 0;
            outline: 0;
            padding: 0;
            vertical-align: baseline;
            text-rendering: optimizeLegibility;
        }

        body {
            margin: 0;
            font-family: "Lato", sans-serif;
        }

        .resume-top-sec {
            width: 794px;
            min-height: 1110px;
            margin: auto;
            margin-top: 10px;
            margin-bottom: 10px;
            background: #fff;
            overflow: hidden;
            padding: 0px 0px 0;
            border: 1px solid #000024;
            position: relative;
        }

        .resume-section .resume-top-sec .top-section {
            display: flex;
            flex-wrap: wrap;
        }

        .resume-section .resume-top-sec .top-section .left-sec {
            width: 60%;
            padding-left: 40px;
            padding-right: 20px;
            padding-top: 40px;
            background: #F2F2F2;
        }

        .resume-section .resume-top-sec .top-section .left-sec .contact-sec {
            margin: 0 0 35px;
        }

        .resume-section .resume-top-sec .top-section .right-sec .image-section {
            line-height: 0;
        }

        .resume-section .resume-top-sec .top-section .right-sec {
            width: 40%;
        }

        .resume-section .resume-top-sec .top-section .right-sec .image-section img {
            width: 100%;
            height: 380px;
            object-fit: cover;
            object-position: top;
        }

        .resume-section .resume-top-sec .top-section .left-sec .contact-sec p {
            display: flex;
            gap: 15px;
            align-items: center;
            margin: 0 0 15px;
        }

        .resume-section .resume-top-sec .top-section .left-sec .contact-sec p svg {
            width: 20px;
            height: 20px;
        }

        .resume-section .resume-top-sec .top-section .left-sec .contact-sec p a,
        .resume-section .resume-top-sec .top-section .left-sec .contact-sec p {
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            color: #000;
        }

        .resume-section .resume-top-sec .top-section .left-sec .name-position h6 {
            font-size: 18px;
            margin: 0 0 15px;
        }

        .resume-section .resume-top-sec .top-section .left-sec .name-position h1 {

            font-size: 52px;
            line-height: 60px;
            margin: 0 0 20px;
        }

        .resume-section .resume-top-sec .row-sec {
            display: flex;
            flex-wrap: wrap;
        }

        .resume-section .resume-top-sec .row-sec .column-left {
            width: 60%;
            padding-right: 20px;
            padding-bottom: 40px;
            padding-top: 40px;
            padding-left: 40px;
        }

        .resume-section .resume-top-sec .row-sec .column-right {
            width: 40%;
            padding-left: 20px;
            background: #F2F2F2;
            padding-top: 40px;
            padding-bottom: 40px;
            padding-right: 40px;
        }

        .resume-section .resume-top-sec .row-sec .column-left .experince h4,
        .resume-section .resume-top-sec .row-sec .column-right .summary-sec h4,
        .resume-section .resume-top-sec .row-sec .column-right .skills h4,
        .education h4 {
            font-size: 22px;
            font-weight: 600;
            margin: 0 0 20px;
            line-height: normal;
        }

        .resume-section .resume-top-sec .row-sec .column-left .experince h5 {
            font-size: 18px;
            font-weight: 600;
            line-height: normal;
            margin: 0 0 10px;
        }

        .resume-section .resume-top-sec .row-sec .column-left .experince .details-sec h6,
        .education .education_details h6 {
            font-size: 18px;
            font-weight: 500;
            line-height: 28px;
            margin: 0 0 20px;
            color: #000;
        }

        .resume-section .resume-top-sec .row-sec .column-left .experince .details-sec p,
        .resume-section .resume-top-sec .row-sec .column-right .summary-sec p {
            font-size: 17px;
            line-height: 26px;
            margin: 0 0 15px;
            color: #000;
        }

        .resume-section .resume-top-sec .row-sec .column-left .experince .details-sec ul,
        .resume-section .resume-top-sec .row-sec .column-right .skills ul {
            padding: 0 0px 0 20px;
            margin: 0 0 20px;
        }

        .resume-section .resume-top-sec .row-sec .column-left .experince .details-sec ul li,
        .resume-section .resume-top-sec .row-sec .column-right .skills ul li {
            font-size: 17px;
            line-height: 26px;
            margin: 0 0 10px;
            color: #000;
        }

        .resume-section .resume-top-sec .row-sec .column-right .summary-sec {
            padding: 0 0 40px;
        }

        .resume-section .resume-top-sec .row-sec .column-left .experince .details-sec,
        .education {
            margin: 0 0 40px;
        }

        .resume-section .resume-top-sec .row-sec .column-right .summary-sec p {
            margin: 0;
        }

        .resume-section .resume-top-sec .row-sec .column-right .skills ul {
            margin: 0;
        }
    </style>
</head>

<body>
    <div class="resume-section">
        <div class="resume-top-sec">
            <div class="top-section">
                <div class="left-sec">
                    <div class="contact-sec">
                        {{contact}}
                    </div>
                    <div class="name-position">
                        {{tagline}}
                        <h1>{{name}}</h1>
                    </div>
                </div>
                <div class="right-sec">
                    <div class="image-section">
                        <img src="{{photoUrl}}" alt="{{name}}">
                    </div>
                </div>
            </div>
            <div class="row-sec">
                <div class="column-left">
                    <div class="experince">
                        <h4>EXPERIENCE</h4>
                        <h5>Career Highlights</h5>
                        {{experience}}
                    </div>
                </div>
                <div class="column-right">
                    <div class="summary-sec">
                        <h4>PROFESSIONAL SUMMARY</h4>
                        {{summary}}
                    </div>
                    <div class="education">
                        <h4>EDUCATION</h4>
                        {{education}}
                    </div>
                    <div class="skills">
                        <h4>SKILLS</h4>
                        <ul>
                            {{skills}}
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
