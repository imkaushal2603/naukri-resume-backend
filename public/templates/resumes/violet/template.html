<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <title>Violet Resume</title>
    <style>
        @page {
            size: A4;
            margin: 0;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body,
        div,
        span,
        applet,
        object,
        iframe,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        p,
        blockquote,
        pre,
        a,
        abbr,
        acronym,
        address,
        big,
        cite,
        code,
        del,
        dfn,
        em,
        font,
        img,
        ins,
        kbd,
        q,
        s,
        samp,
        small,
        strike,
        strong,
        sub,
        sup,
        tt,
        var,
        b,
        u,
        i,
        center,
        dl,
        dt,
        dd,
        ol,
        ul,
        li,
        fieldset,
        form,
        label,
        legend,
        table,
        caption,
        tbody,
        tfoot,
        thead,
        tr,
        th,
        td {
            background: transparent;
            border: 0;
            font-size: 100%;
            margin: 0;
            outline: 0;
            padding: 0;
            vertical-align: baseline;
            text-rendering: optimizeLegibility;
        }

        body {
            margin: 0;
            font-family: "Inter", sans-serif;
        }

        .resume {
            width: 794px;
            min-height: 1110px;
            margin: 10px auto;
            background: #fff;
            border-radius: 10px;
            overflow: hidden;
            border: 3px solid #8156E4;
            padding: 55px 0 55px 35px;
        }

        .header {
            display: flex;
            flex-direction: column;
            row-gap: 40px;
        }

        .header .header_top {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header .header_left {
            width: calc(60% - 10px);
        }

        .header .header_right {
            width: calc(40% - 10px);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .header .header_left h1 {
            font-weight: 700;
            font-size: 56px;
            line-height: 100%;
            color: #8156E4;
            margin-bottom: 20px;
        }

        .header .header_left h4 {
            font-weight: 400;
            font-size: 26px;
            line-height: 100%;
            color: #000000;
            margin-bottom: 15px;
        }

        .header .header_left p,
        .education .education_details p {
            font-weight: 400;
            font-size: 15px;
            line-height: 140%;
            color: #000000;
            display: inline-block;
        }

        .header .header_right img {
            width: 160px;
            position: relative;
            z-index: 1;
            height: 160px;
            border-radius: 50%;
        }

        .header .header_image_bg {
            position: absolute;
            right: -2px;
            width: 100%;
        }

        .header .header_image_bg svg {
            width: 100%;
            height: 100%;
        }

        .header_bottom {
            border: 3px solid #8156E4;
            border-right: none;
            border-radius: 10px 0 0 10px;
            padding: 22px;
            background: #CBC8FA;
        }

        .header_bottom .header_info {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            row-gap: 12px;
        }

        .header_bottom .header_details {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header_bottom .header_details a,
        .header_bottom .header_details p {
            display: inline-block;
            text-decoration: none;
            font-weight: 500;
            font-size: 15px;
            line-height: 100%;
            color: #000024;
        }

        .resume_content {
            display: flex;
            flex-wrap: wrap;
            margin-top: 40px;
            margin-right: 35px;
        }

        .resume_content .resume_left {
            width: 40%;
            padding-right: 25px;
            border-right: 4px solid #8156E4;
            display: flex;
            flex-direction: column;
            row-gap: 30px;
        }

        .resume_content .resume_right {
            width: 60%;
            padding-left: 25px;
        }

        .education h2,
        .skills h2,
        .experience h2 {
            border: 2px solid #8156E4;
            background: #CBC8FA;
            border-radius: 10px;
            padding: 10px 20px;
            font-weight: 500;
            font-size: 26px;
            line-height: 100%;
            margin-bottom: 20px;
            max-width: 240px;
        }

        .skills .skills_info,
        .education .education_info,
        .experience .experience_info {
            display: flex;
            flex-direction: column;
            row-gap: 12px;
        }

        .skills .skills_details {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .skills .skills_details p {
            font-weight: 500;
            font-size: 16px;
            line-height: 100%;
            display: inline-block;
            color: #000024;
        }

        .education .education_details h4,
        .experience .experience_details h4 {
            font-weight: 500;
            font-size: 18px;
            line-height: 140%;
            color: #000000;
            margin-bottom: 8px;
        }

        .experience ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            row-gap: 8px;
        }

        .experience ul li {
            padding-left: 20px;
            font-weight: 400;
            font-size: 15px;
            line-height: 140%;
            color: #000000;
            display: inline-block;
            position: relative;
        }

        .experience ul li::before {
            content: "";
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #000000;
            top: 8px;
            left: 0;
        }

        .experience .experience_info {
            row-gap: 25px;
        }
    </style>
</head>

<body>
    <div class="resume">
        <div class="header">
            <div class="header_top">
                <div class="header_left">
                    <h1>{{name}}</h1>
                    {{tagline}}
                    {{summary}}
                </div>
                <div class="header_right">
                    <img src="{{photoUrl}}" alt="{{name}}" />

                    </div>
                </div>
            </div>
            <div class="header_bottom">
                <div class="header_info">
                    {{contact}}
                </div>
            </div>
        </div>
        <div class="resume_content">
            <div class="resume_left">
                <div class="education">
                    <h2>Education</h2>
                    <div class="education_info">
                        {{education}}
                    </div>
                </div>
                <div class="skills">
                    <h2>Skills</h2>
                    <div class="skills_info">
                        {{skills}}
                    </div>
                </div>
            </div>
            <div class="resume_right">
                <div class="experience">
                    <h2>Experience</h2>
                    <div class="experience_info">
                        {{experience}}
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
