<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
        rel="stylesheet">
    <title>Blank Resume</title>
    <style>
        @page {
            size: A4;
            margin: 0;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body,
        div,
        span,
        applet,
        object,
        iframe,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        p,
        blockquote,
        pre,
        a,
        abbr,
        acronym,
        address,
        big,
        cite,
        code,
        del,
        dfn,
        em,
        font,
        img,
        ins,
        kbd,
        q,
        s,
        samp,
        small,
        strike,
        strong,
        sub,
        sup,
        tt,
        var,
        b,
        u,
        i,
        center,
        dl,
        dt,
        dd,
        ol,
        ul,
        li,
        fieldset,
        form,
        label,
        legend,
        table,
        caption,
        tbody,
        tfoot,
        thead,
        tr,
        th,
        td {
            background: transparent;
            border: 0;
            font-size: 100%;
            margin: 0;
            outline: 0;
            padding: 0;
            vertical-align: baseline;
            text-rendering: optimizeLegibility;
        }

        body {
            margin: 0;
            font-family: "Lato", sans-serif;
        }

        .resume {
            width: 794px;
            min-height: 1110px;
            margin: 10px auto;
            background: #fff;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #000000;
        }

        .header {
            padding: 45px 25px;
        }

        .header h1 {
            font-weight: 700;
            font-size: 44px;
            line-height: 100%;
            letter-spacing: 6%;
            color: #000000;
            margin-bottom: 20px;
        }

        .header h4 {
            font-weight: 700;
            font-size: 22px;
            line-height: 100%;
            letter-spacing: 6%;
            color: #1E5D25;
            margin-bottom: 20px;
        }

        .header p {
            font-weight: 700;
            font-size: 16px;
            line-height: 160%;
            letter-spacing: 6%;
            color: #000024CC;
            display: inline-block;
            margin-bottom: 20px;
        }

        .header .header_info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header .header_details {
            line-height: 0;
        }

        .resume_content {
            background: #C7C8CC;
            padding: 0 25px;
        }

        .resume_content .resume_info {
            max-width: 94%;
            margin: auto;
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            gap: 20px;
        }

        .resume_content .resume_info p,
        .resume_content .resume_info a {
            font-weight: 700;
            font-size: 15px;
            line-height: 100%;
            letter-spacing: 6%;
            color: #FFFFFF;
            display: inline-block;
            text-decoration: none;
        }

        .resume_content .resume_info p {
            padding-right: 20px;
            border-right: 1px solid #FFFFFF;
        }

        .resume_content .resume_details:last-child p {
            padding-right: 0;
            border-right: none;
        }

        .resume_content .resume_heading {
            border-top: 3px solid #000000;
        }

        .resume_section {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .resume_section .resume_left {
            width: calc(65% - 10px);
            padding-top: 60px;
            padding-bottom: 45px;
        }

        .resume_section .resume_right {
            width: calc(35% - 10px);
            padding-top: 60px;
            display: flex;
            flex-direction: column;
            row-gap: 30px;
            border-left: 2px solid #000024;
            padding-left: 15px;
            padding-bottom: 45px;
        }

        .experience h2,
        .education h2,
        .skills h2 {
            font-weight: 700;
            font-size: 26px;
            line-height: 100%;
            letter-spacing: 6%;
            color: #000024;
            margin-bottom: 12px;
        }

        .experience .experience_info {
            display: flex;
            flex-direction: column;
            row-gap: 25px;
        }

        .experience .experience_details {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .experience .experience_left {
            width: 170px;
        }

        .experience .experience_right {
            width: calc(100% - 190px);
        }

        .experience .experience_details h4,
        .education .education_details h4 {
            font-weight: 600;
            font-size: 16px;
            line-height: 140%;
            color: #000024;
        }

        .experience .experience_details ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            row-gap: 8px;
            margin-top: 12px;
        }

        .experience .experience_details li {
            font-weight: 400;
            font-size: 16px;
            line-height: 140%;
            color: #000024E5;
            display: inline-block;
            position: relative;
            padding-left: 20px;
        }

        .experience .experience_details li::before {
            content: "";
            position: absolute;
            left: 0;
            top: 8px;
            width: 8px;
            height: 8px;
            background: #000024E5;
            border-radius: 50%;
        }

        .education .education_info {
            display: flex;
            flex-direction: column;
            row-gap: 18px;
        }

        .education .education_details h4 {
            margin-bottom: 10px;
        }

        .education .education_details p,
        .skills .skills_details p {
            font-weight: 400;
            font-size: 16px;
            line-height: 140%;
            color: #000024E5;
            display: inline-block;
        }

        .skills .skills_info {
            display: flex;
            flex-direction: column;
            row-gap: 8px;
        }
    </style>
</head>

<body>
    <div class="resume">
        <div class="header">
            <h1>{{name}}</h1>
            {{tagline}}
            {{summary}}
            <div class="header_info">
                {{socialLinks}}
            </div>
        </div>
        <div class="resume_content">
            <div class="resume_heading">
                <div class="resume_info">
                    {{contact}}
                </div>
            </div>
            <div class="resume_section">
                <div class="resume_left">
                    <div class="experience">
                        <h2>Experience</h2>
                        <div class="experience_info">
                            {{experience}}
                        </div>
                    </div>
                </div>
                <div class="resume_right">
                    <div class="education">
                        <h2>Education</h2>
                        <div class="education_info">
                            {{education}}
                        </div>
                    </div>
                    <div class="skills">
                        <h2>Skills</h2>
                        <div class="skills_info">
                            {{skills}}
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
