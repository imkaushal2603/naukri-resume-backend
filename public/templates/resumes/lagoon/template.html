<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
        rel="stylesheet">
    <title>Lagoon Resume</title>
    <style>
        @page {
            size: A4;
            margin: 0;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body,
        div,
        span,
        applet,
        object,
        iframe,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        p,
        blockquote,
        pre,
        a,
        abbr,
        acronym,
        address,
        big,
        cite,
        code,
        del,
        dfn,
        em,
        font,
        img,
        ins,
        kbd,
        q,
        s,
        samp,
        small,
        strike,
        strong,
        sub,
        sup,
        tt,
        var,
        b,
        u,
        i,
        center,
        dl,
        dt,
        dd,
        ol,
        ul,
        li,
        fieldset,
        form,
        label,
        legend,
        table,
        caption,
        tbody,
        tfoot,
        thead,
        tr,
        th,
        td {
            background: transparent;
            border: 0;
            font-size: 100%;
            margin: 0;
            outline: 0;
            padding: 0;
            vertical-align: baseline;
            text-rendering: optimizeLegibility;
        }

        body {
            margin: 0;
            font-family: "Lato", sans-serif;
        }

        .resume {
            width: 794px;
            min-height: 1110px;
            margin: 10px auto;
            background: #fff;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #43969C;
        }

        .header {
            padding: 30px 0;
        }

        .header .header_title {
            padding-left: 205px;
            position: relative;
            margin: 0 25px;
        }

        .header .header_image {
            position: absolute;
            width: 170px;
            height: 170px;
            left: 0;
            border: 4px solid #29B33A;
            border-radius: 50%;
        }

        .header .header_image img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .header .header_summary {
            background: #323D4D;
            padding: 30px 25px 30px 230px;
        }

        .header h1 {
            font-weight: 700;
            font-size: 38px;
            line-height: 100%;
            letter-spacing: 2%;
            color: #000024;
            margin-bottom: 10px;
        }

        .header h4 {
            font-weight: 700;
            font-size: 24px;
            line-height: 100%;
            letter-spacing: 2%;
            color: #29B33A;
            margin-bottom: 20px;
        }

        .header p {
            font-weight: 400;
            font-size: 16px;
            line-height: 140%;
            color: #FFFFFF;
            display: inline-block;
        }

        .header .header_info {
            background: #43969C;
            padding: 20px 25px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 40px;
            justify-content: center;
            row-gap: 16px;
        }

        .header .header_details {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header .header_details p,
        .header .header_details a {
            line-height: normal;
            text-decoration: none;
            color: #FFFFFF;
        }

        .resume_content {
            padding: 0 25px 40px;
        }

        .education h2,
        .experience h2,
        .skills h2 {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .education h4,
        .experience h4 {
            font-weight: 600;
            font-size: 18px;
            line-height: 100%;
            color: #000024;
            margin-bottom: 10px;
        }

        .education .education_info,
        .experience .experience_info {
            display: flex;
            flex-direction: column;
            row-gap: 25px;
        }

        .education p,
        .experience p,
        .experience ul li,
        .skills p {
            font-weight: 400;
            font-size: 16px;
            line-height: normal;
            color: #000024;
        }

        .experience {
            border-top: 2px dashed #000024;
            border-bottom: 2px dashed #000024;
            padding: 30px 0;
            margin: 30px 0;
        }

        .experience ul {
            display: flex;
            flex-direction: column;
            row-gap: 8px;
            list-style: none;
        }

        .experience p {
            margin-bottom: 10px;
        }

        .experience ul li,
        .skills p {
            padding-left: 20px;
            position: relative;
        }

        .experience ul li::before,
        .skills p::before {
            content: "";
            width: 8px;
            height: 8px;
            position: absolute;
            left: 0;
            top: 6px;
            background: #43969C;
            border-radius: 50%;
        }

        .skills .skills_info {
            display: flex;
            flex-direction: column;
            row-gap: 8px;
        }
    </style>
</head>
