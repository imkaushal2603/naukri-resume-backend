<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sage Resume</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
        rel="stylesheet">
    <style>
        @page {
            size: A4;
            margin: 0;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body,
        div,
        span,
        applet,
        object,
        iframe,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        p,
        blockquote,
        pre,
        a,
        abbr,
        acronym,
        address,
        big,
        cite,
        code,
        del,
        dfn,
        em,
        font,
        img,
        ins,
        kbd,
        q,
        s,
        samp,
        small,
        strike,
        strong,
        sub,
        sup,
        tt,
        var,
        b,
        u,
        i,
        center,
        dl,
        dt,
        dd,
        ol,
        ul,
        li,
        fieldset,
        form,
        label,
        legend,
        table,
        caption,
        tbody,
        tfoot,
        thead,
        tr,
        th,
        td {
            background: transparent;
            border: 0;
            font-size: 100%;
            margin: 0;
            outline: 0;
            padding: 0;
            vertical-align: baseline;
            text-rendering: optimizeLegibility;
        }

        body {
            margin: 0;
            font-family: "Lato", sans-serif;
        }

        .resume-top-sec {
            width: 794px;
            min-height: 1110px;
            margin: auto;
            margin-top: 10px;
            margin-bottom: 10px;
            background: #fff;
            overflow: hidden;
            border: 1px solid #000024;
            position: relative;
        }

        .resume-section .resume-top-sec .top-section {
            display: flex;
            flex-wrap: wrap;
        }

        .resume-section .resume-top-sec .top-section .image-left {
            width: 40%;
            background: #9ABECC;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .resume-section .resume-top-sec .top-section .profile-right {
            width: 60%;
            padding: 20px;
        }

        .resume-section .resume-top-sec .top-section .image-left img {
            width: 150px;
            height: 150px;
            border-radius: 100%;
            object-fit: cover;
            object-position: top;
            border: 4px solid #E5F6EB;
        }

        .resume-section .resume-top-sec .top-section .profile-right h4,
        .resume-section .resume-top-sec .row-sec .column-right .experience h4 {
            font-size: 22px;
            font-weight: 700;
            line-height: normal;
            margin: 0 0 20px;
            position: relative;
            background: #fff;
            width: fit-content;
            padding-right: 15px;
        }

        .resume-section .resume-top-sec .row-sec .column-left .contacts h4,
        .resume-section .resume-top-sec .row-sec .column-left .education h4,
        .resume-section .resume-top-sec .row-sec .column-left .skills h4 {
            font-size: 22px;
            font-weight: 700;
            line-height: normal;
            margin: 0 0 20px;
            position: relative;
            background: #9ABECC;
            width: fit-content;
            padding-right: 15px;
        }

        .resume-section .resume-top-sec .top-section .profile-right p {
            color: #000;
            font-size: 16px;
            line-height: 24px;
            font-weight: 400;
        }

        .resume-section .resume-top-sec .border-line {
            position: relative;
        }

        .resume-section .resume-top-sec .border-line:before {
            position: absolute;
            content: '';
            border: 1px solid;
            width: 99%;
            top: 50%;
            right: 0;
        }

        .resume-section .resume-top-sec .name-with-position {
            background: #E5F6EB;
            padding: 40px;
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
        }

        .resume-section .resume-top-sec .name-with-position .name-txt {
            width: 60%;
            padding-right: 20px;
        }

        .resume-section .resume-top-sec .name-with-position .position-txt {
            padding-left: 20px;
            width: 40%;
            text-align: end;
        }

        .resume-section .resume-top-sec .name-with-position .name-txt h1 {
            font-size: 42px;
            line-height: normal;
            margin: 0;
            color: #000;
            font-weight: 600;
        }

        .resume-section .resume-top-sec .name-with-position .position-txt h6 {
            font-size: 18px;
            line-height: normal;
            border-top: 1px solid #000;
            border-bottom: 1px solid #000;
            padding: 10px 0;
            width: fit-content;
            margin: 0 0 0 auto;
            font-weight: 500;
        }

        .resume-section .resume-top-sec .row-sec {
            display: flex;
            flex-wrap: wrap;
        }

        .resume-section .resume-top-sec .row-sec .column-left {
            width: 40%;
            background: #9ABECC;
        }

        .resume-section .resume-top-sec .row-sec .column-right {
            width: 60%;
        }

        .resume-section .resume-top-sec .row-sec .column-left .contacts,
        .resume-section .resume-top-sec .row-sec .column-left .education,
        .resume-section .resume-top-sec .row-sec .column-left .skills,
        .resume-section .resume-top-sec .row-sec .column-right .experience {
            padding: 30px;
        }

        .resume-section .resume-top-sec .row-sec .column-left .skills,
        .resume-section .resume-top-sec .row-sec .column-left .education {
            padding-top: 0 !important;

        }

        .resume-section .resume-top-sec .row-sec .column-left .contacts p a,
        .resume-section .resume-top-sec .row-sec .column-left .contacts p {
            color: #000;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            margin: 0 0 10px;
        }

        .resume-section .resume-top-sec .row-sec .column-left .education p {
            font-size: 16px;
            font-weight: 400;
            line-height: 24px;
            margin: 0 0 12px;
        }

        .resume-section .resume-top-sec .row-sec .column-left .skills p {
            font-size: 16px;
            margin: 0 0 12px;
            font-weight: 400;
            color: #000;
        }

        .resume-section .resume-top-sec .row-sec .column-right .experience .details {
            margin: 0 0 30px;
        }

        .resume-section .resume-top-sec .row-sec .column-right .experience .details h6 {
            font-size: 17px;
            margin: 0 0 10px;
            color: #000;
            font-weight: 600;
        }

        .resume-section .resume-top-sec .row-sec .column-right .experience .details p {
            font-size: 16px;
            font-weight: 400;
            line-height: 24px;
            color: #000;
        }
    </style>
</head>

<body>
    <div class="resume-section">
        <div class="resume-top-sec">
            <div class="top-section">
                <div class="image-left">
                    <img src="{{photoUrl}}" alt="{{name}}">
                </div>
                <div class="profile-right">
                    <div class="border-line">
                        <h4>Profile</h4>
                    </div>
                    {{summary}}
                </div>
            </div>
            <div class="name-with-position">
                <div class="name-txt">
                    <h1>{{name}}</h1>
                </div>
                <div class="position-txt">
                    {{tagline}}
                </div>
            </div>
            <div class="row-sec">
                <div class="column-left">
                    <div class="contacts">
                        <div class="border-line">
                            <h4>Contact</h4>
                        </div>
                        {{contact}}
                    </div>
                    <div class="education">
                        <div class="border-line">
                            <h4>Education</h4>
                        </div>
                        {{education}}
                    </div>
                    <div class="skills">
                        <div class="border-line">
                            <h4>Skills</h4>
                        </div>
                        {{skills}}
                    </div>
                </div>
                <div class="column-right">
                    <div class="experience">
                        <div class="border-line">
                            <h4>Experience</h4>
                        </div>
                        {{experience}}
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
