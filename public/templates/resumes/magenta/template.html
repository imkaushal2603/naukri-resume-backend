<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Magenta Resume</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
        rel="stylesheet">
    <style>
        @page {
            size: A4;
            margin: 0;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body,
        div,
        span,
        applet,
        object,
        iframe,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        p,
        blockquote,
        pre,
        a,
        abbr,
        acronym,
        address,
        big,
        cite,
        code,
        del,
        dfn,
        em,
        font,
        img,
        ins,
        kbd,
        q,
        s,
        samp,
        small,
        strike,
        strong,
        sub,
        sup,
        tt,
        var,
        b,
        u,
        i,
        center,
        dl,
        dt,
        dd,
        ol,
        ul,
        li,
        fieldset,
        form,
        label,
        legend,
        table,
        caption,
        tbody,
        tfoot,
        thead,
        tr,
        th,
        td {
            background: transparent;
            border: 0;
            font-size: 100%;
            margin: 0;
            outline: 0;
            padding: 0;
            vertical-align: baseline;
            text-rendering: optimizeLegibility;
        }

        body {
            margin: 0;
            font-family: "Lato", sans-serif;
        }

        .resume-top-sec {
            width: 794px;
            min-height: 1110px;
            margin: auto;
            margin-top: 10px;
            margin-bottom: 10px;
            background: #fff;
            overflow: hidden;
            padding: 40px 0px 0;
            border: 1px solid #000024;
            position: relative;
        }

        .resume-new-section .resume-top-sec {
            background: #FD73AE;
        }

        .resume-new-section .resume-top-sec .top-section {
            display: flex;
            flex-wrap: wrap;
        }

        .resume-new-section .resume-top-sec .top-section .left-sec {
            width: 60%;
        }

        .resume-new-section .resume-top-sec .top-section .right-sec {
            width: 40%;
        }

        .resume-new-section .resume-top-sec .top-section .right-sec .img-position {
            background: #fff;
            padding: 20px;
            border-radius: 15px;
            margin-right: 30px;
        }

        .resume-new-section .resume-top-sec .top-section .right-sec .img-position .img {
            line-height: 0;
        }

        .resume-new-section .resume-top-sec .top-section .right-sec .img-position .img img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-radius: 10px;
        }

        .resume-new-section .resume-top-sec .top-section .right-sec .img-position .position {
            margin-top: 20px;
            background: #fd73ae;
            padding: 10px;
            border-radius: 10px;
        }

        .resume-new-section .resume-top-sec .top-section .right-sec .img-position .position h4 {
            font-size: 20px;
            text-align: center;
            font-weight: 900;
            color: #fff;
        }

        .resume-new-section .resume-top-sec .top-section .left-sec .name-profile h1 {
            font-size: 44px;
            letter-spacing: 5%;
            font-weight: 900;
            color: #fff;
            padding: 0 30px 20px;
        }

        .resume-new-section .resume-top-sec .top-section .left-sec .name-profile .profile {
            background: #638992;
            padding: 20px;
        }

        .resume-new-section .resume-top-sec .top-section .left-sec .name-profile .profile p {
            font-size: 15px;
            line-height: 22px;
            color: #fff;
        }

        .resume-new-section .resume-top-sec .top-section .left-sec .contact-sec {
            background: #638992;
            margin-left: 20px;
            margin-top: 20px;
            padding: 10px;
            border-radius: 12px 0px 0 12px;
            display: flex;
            flex-wrap: wrap;
            row-gap: 15px;
            margin-bottom: 10px;
        }

        .resume-new-section .resume-top-sec .top-section .right-sec {
            width: 40%;
            display: flex;
            justify-content: end;
            flex-direction: column;
        }

        .resume-new-section .resume-top-sec .top-section .left-sec .contact-sec .icon-txt {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            width: 50%;
            padding: 0 10px;
        }

        .resume-new-section .resume-top-sec .top-section .left-sec .contact-sec .icon-txt .icon {
            width: 35px;
        }

        .resume-new-section .resume-top-sec .top-section .left-sec .contact-sec .icon-txt .txt {
            width: calc(100% - 35px);
            padding-left: 10px;
        }

        .resume-new-section .resume-top-sec .top-section .left-sec .contact-sec .icon-txt .txt p {
            font-size: 15px;
            font-weight: 400;
            color: #fff;
        }

        .resume-new-section .resume-top-sec .top-section .left-sec .contact-sec .icon-txt .txt p a {
            font-size: 15px;
            color: #fff;
            text-decoration: none;
            word-break: break-word;
        }

        .resume-new-section .resume-top-sec .row-sec {
            padding: 60px 30px;
            display: flex;
            flex-wrap: wrap;
        }

        .resume-new-section .resume-top-sec .row-sec .column-left {
            width: 45%;
            padding-right: 15px;
        }

        .resume-new-section .resume-top-sec .row-sec .column-right {
            width: 55%;
            padding-left: 15px;
        }

        .resume-new-section .resume-top-sec .row-sec .column-left .contact-sec,
        .resume-new-section .resume-top-sec .row-sec .column-left .skills {
            background: #638992;
            padding: 20px;
            border-radius: 15px;
            position: relative;
        }

        .resume-new-section .resume-top-sec .row-sec .column-left .title,
        .resume-new-section .resume-top-sec .row-sec .column-left .skills .title,
        .resume-new-section .resume-top-sec .row-sec .column-right .experince-sec .title {
            background: #fff;
            padding: 6px 40px;
            border-radius: 6px;
            text-align: center;
            transform: translateY(-40px);
            width: fit-content;
            margin: 0 auto;
        }

        .resume-new-section .resume-top-sec .row-sec .column-left .title h4 {
            font-size: 22px;
            font-weight: 600;
            line-height: normal;
            color: #638992;
        }

        .resume-new-section .resume-top-sec .row-sec .column-left .contact-sec .details h5 {
            font-size: 20px;
            font-weight: 700;
            line-height: normal;
            color: #fff;
            margin: 0 0 10px;
        }

        .resume-new-section .resume-top-sec .row-sec .column-left .contact-sec .details h6 {
            font-size: 17px;
            line-height: 25px;
            margin: 0 0 10px;
            font-weight: 600;
            color: #fff;
        }

        .resume-new-section .resume-top-sec .row-sec .column-left .contact-sec .details p {
            font-size: 15px;
            line-height: 22px;
            color: #fff;
        }

        .resume-new-section .resume-top-sec .row-sec .column-left .skills {
            margin-top: 40px;
        }

        .resume-new-section .resume-top-sec .row-sec .column-left .skills .icon-txt {
            display: flex;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .resume-new-section .resume-top-sec .row-sec .column-left .skills .icon-txt .icon {
            width: 20px;
        }

        .resume-new-section .resume-top-sec .row-sec .column-left .skills .icon-txt p {
            width: calc(100% - 20px);
            padding-left: 10px;
            font-size: 16px;
            font-weight: 500;
            line-height: normal;
            color: #fff;
        }

        .resume-new-section .resume-top-sec .row-sec .column-left .skills .icon-txt .icon svg {
            width: 20px;
            height: 20px;
        }

        .resume-new-section .resume-top-sec .row-sec .column-right .experince-sec {
            background: #638992;
            padding: 20px;
            border-radius: 15px;
            position: relative;
        }

        .resume-new-section .resume-top-sec .row-sec .column-right .experince-sec .title h4 {
            font-size: 22px;
            font-weight: 600;
            line-height: normal;
            color: #638992;
        }

        .resume-new-section .resume-top-sec .row-sec .column-right .experince-sec .details h5 {
            font-size: 20px;
            font-weight: 700;
            line-height: normal;
            color: #fff;
            margin: 0 0 10px;
        }

        .resume-new-section .resume-top-sec .row-sec .column-right .experince-sec .details h6 {
            font-size: 17px;
            line-height: 25px;
            margin: 0 0 10px;
            font-weight: 600;
            color: #fff;
        }

        .resume-new-section .resume-top-sec .row-sec .column-right .experince-sec .details p {
            font-size: 15px;
            line-height: 22px;
            color: #fff;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <div class="resume-new-section">
        <div class="resume-top-sec">
            <div class="top-section">
                <div class="left-sec">
                    <div class="name-profile">
                        <h1>{{name}}</h1>
                        <div class="profile">
                            {{summary}}
                        </div>
                        <div class="contact-sec">
                            {{contact}}
                        </div>
                    </div>
                </div>
                <div class="right-sec">
                    <div class="img-position">
                        <div class="img">
                            <img src="{{photoUrl}}" alt="{{name}}">
                        </div>
                        <div class="position">
                            {{tagline}}
                        </div>
                    </div>
                </div>
            </div>
            <div class="row-sec">
                <div class="column-left">
                    <div class="contact-sec">
                        <div class="title">
                            <h4>Education</h4>
                        </div>
                        {{education}}
                    </div>
                    <div class="skills">
                        <div class="title">
                            <h4>Skills</h4>
                        </div>
                        {{skills}}
                    </div>
                </div>
                <div class="column-right">
                    <div class="experince-sec">
                        <div class="title">
                            <h4>Experience</h4>
                        </div>
                        {{experience}}
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
