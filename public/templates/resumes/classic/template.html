<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
        rel="stylesheet">
    <title>Classic Resume</title>
    <style>
        @page {
            size: A4;
            margin: 0;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body,
        div,
        span,
        applet,
        object,
        iframe,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        p,
        blockquote,
        pre,
        a,
        abbr,
        acronym,
        address,
        big,
        cite,
        code,
        del,
        dfn,
        em,
        font,
        img,
        ins,
        kbd,
        q,
        s,
        samp,
        small,
        strike,
        strong,
        sub,
        sup,
        tt,
        var,
        b,
        u,
        i,
        center,
        dl,
        dt,
        dd,
        ol,
        ul,
        li,
        fieldset,
        form,
        label,
        legend,
        table,
        caption,
        tbody,
        tfoot,
        thead,
        tr,
        th,
        td {
            background: transparent;
            border: 0;
            font-size: 100%;
            margin: 0;
            outline: 0;
            padding: 0;
            vertical-align: baseline;
            text-rendering: optimizeLegibility;
        }

        body {
            margin: 0;
            font-family: "Lato", sans-serif;
        }

        .resume {
            width: 794px;
            min-height: 1110px;
            margin: 10px auto;
            background: #fff;
            border-radius: 10px;
            overflow: hidden;
            padding: 40px 25px;
            border: 2px solid #000024;
        }

        .header {
            border-bottom: 1px solid #000024;
            padding-bottom: 45px;
        }

        .header h1 {
            font-weight: 700;
            font-size: 34px;
            line-height: 100%;
            color: #000024;
            margin-bottom: 20px;
            text-align: center;
        }

        .header p {
            font-weight: 400;
            font-size: 18px;
            line-height: 100%;
            color: #000024;
            display: inline-block;
            margin-bottom: 18px;
            text-align: center;
            width: 100%;
        }

        .header .header_info {
            display: flex;
            flex-wrap: wrap;
            gap: 35px;
            justify-content: center;
            align-items: center;
            max-width: 600px;
            margin: auto;
            row-gap: 15px;
        }

        .header .header_details {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .header .header_details p,
        .header .header_details a {
            margin: 0;
            font-size: 14px;
            text-decoration: none;
            color: #000024;
        }

        .header .header_icon,
        .header .header_text {
            line-height: 0;
        }

        .summary {
            padding: 30px 0;
            border-bottom: 1px solid #000024;
        }

        .summary h2,
        .education h2,
        .experience h2,
        .skills h2 {
            font-weight: 700;
            font-size: 24px;
            line-height: 100%;
            color: #000024;
            margin-bottom: 15px;
        }

        .summary p {
            font-weight: 400;
            font-size: 15px;
            line-height: 150%;
            color: #000024;
            display: inline-block;
        }

        .education,
        .experience {
            padding: 30px 0;
            border-bottom: 1px solid #000024;
        }

        .education .education_details h4,
        .experience .experience_details h4 {
            font-weight: 600;
            font-size: 17px;
            line-height: 100%;
            color: #000000;
            margin-bottom: 10px;
        }

        .education .education_details p,
        .experience .experience_details p {
            font-weight: 400;
            font-size: 16px;
            line-height: 100%;
            color: #000024;
            display: inline-block;
            margin-bottom: 20px;
        }

        .education .education_details:last-child p,
        .experience .experience_details:last-child ul {
            margin: 0;
        }

        .experience .experience_details ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            row-gap: 8px;
            margin-bottom: 30px;
        }

        .experience .experience_details ul li {
            font-weight: 400;
            font-size: 15px;
            line-height: 130%;
            display: inline-block;
            color: #000024;
            padding-left: 20px;
            position: relative;
        }

        .experience .experience_details ul li::before {
            content: "";
            background-color: #000024;
            border-radius: 50%;
            width: 8px;
            height: 8px;
            position: absolute;
            left: 0;
            top: 7px;
        }

        .skills {
            padding-top: 30px;
        }

        .skills .skills_info {
            display: flex;
            flex-direction: column;
            row-gap: 8px;
        }

        .skills .skills_info p {
            font-size: 16px;
            line-height: 100%;
            color: #000000;
            display: inline-block;
        }

        .experience_details,
        .skills_details {
            page-break-inside: avoid;
            break-inside: avoid;
        }
    </style>
</head>

<body>
    <div class="resume">
        <div class="header">
            <h1>{{name}}</h1>
            {{tagline}}
            <div class="header_info">{{headerInfo}}</div>
        </div>
        <div class="summary">
            <h2>SUMMARY</h2>
            {{summary}}
        </div>
        <div class="education">
            <h2>EDUCATION</h2>
            <div class="education_info">{{education}}</div>
        </div>
        <div class="experience">
            <h2>EXPERIENCE</h2>
            <div class="experience_info">{{experience}}</div>
        </div>
        <div class="skills">
            <h2>SKILLS</h2>
            <div class="skills_info">{{skills}}</div>
        </div>
    </div>
</body>

</html>
