<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frost Resume</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
        rel="stylesheet">
    <style>
        @page {
            size: A4;
            margin: 0;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body,
        div,
        span,
        applet,
        object,
        iframe,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        p,
        blockquote,
        pre,
        a,
        abbr,
        acronym,
        address,
        big,
        cite,
        code,
        del,
        dfn,
        em,
        font,
        img,
        ins,
        kbd,
        q,
        s,
        samp,
        small,
        strike,
        strong,
        sub,
        sup,
        tt,
        var,
        b,
        u,
        i,
        center,
        dl,
        dt,
        dd,
        ol,
        ul,
        li,
        fieldset,
        form,
        label,
        legend,
        table,
        caption,
        tbody,
        tfoot,
        thead,
        tr,
        th,
        td {
            background: transparent;
            border: 0;
            font-size: 100%;
            margin: 0;
            outline: 0;
            padding: 0;
            vertical-align: baseline;
            text-rendering: optimizeLegibility;
        }

        body {
            margin: 0;
            font-family: "Lato", sans-serif;
        }

        .resume {
            width: 794px;
            min-height: 1110px;
            margin: auto;
            margin-top: 10px;
            margin-bottom: 10px;
            background: #fff;
            border-radius: 10px;
            overflow: hidden;
            padding: 60px 35px 35px;
            border: 1px solid #000024;
        }

        .header {
            display: flex;
            flex-direction: column;
            row-gap: 40px;
        }

        .header .header_top {
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
        }

        .header .header_img {
            width: 120px;
            height: 120px;
            line-height: 0;
        }

        .header .header_img img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .header .header_name {
            width: calc(100% - 160px);
            position: relative;
        }

        .header .header_top h1 {
            font-weight: 600;
            font-size: 40px;
            line-height: 100%;
            color: #000024;
            margin-bottom: 20px;
            position: relative;
        }

        .header .header_top p {
            font-weight: 600;
            font-size: 20px;
            line-height: 100%;
            color: #000024E5;
            background: #fff;
        }

        .header .header_occupation {
            position: relative;
        }

        .header .header_occupation::after {
            content: "";
            position: absolute;
            left: 0;
            top: 50%;
            height: 1px;
            width: 100%;
            background: #00002499;
            transform: translateY(-50%);
        }

        .header .header_top p {
            font-weight: 600;
            font-size: 20px;
            line-height: 100%;
            color: #000024E5;
            background: #fff;
            position: relative;
            z-index: 1;
            display: inline-block;
            padding-right: 20px;
        }

        .header .header_icon {
            position: absolute;
            left: -25px;
            top: -65px;
        }

        .header .header_occupation::before {
            content: "";
            position: absolute;
            left: 0;
            top: 50%;
            height: 3px;
            width: 55%;
            background: #000024;
            z-index: 1;
            transform: translateY(-50%);
        }

        .header .header_info {
            display: flex;
            flex-wrap: wrap;
            row-gap: 15px;
        }

        .header .header_details {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            width: 33.33%;
            border-bottom: 1px solid #00002499;
            padding-bottom: 12px;
            position: relative;
        }

        .header .header_details:first-child::after {
            content: "";
            position: absolute;
            left: 0;
            width: 90%;
            height: 3px;
            background: #000024;
            bottom: -2px;
        }

        .header .header_content a,
        .header .header_content p {
            font-weight: 500;
            font-size: 16px;
            line-height: 100%;
            display: inline-block;
            color: #000000;
            text-decoration: none;
            word-break: break-word;
        }

        .header .header_svg {
            line-height: 0;
            width: 16px;
        }

        .header .header_content {
            width: calc(100% - 24px);
            padding-right: 20px;
        }

        .resume_content {
            display: flex;
            flex-wrap: wrap;
            margin-top: 40px;
        }

        .resume_content .resume_left {
            width: 40%;
            border-right: 1px solid #00002499;
            padding-right: 25px;
            display: flex;
            flex-direction: column;
            row-gap: 25px;
        }

        .resume_content .resume_right {
            width: 60%;
            padding-left: 25px;
        }

        .summary h2,
        .education h2,
        .skills h2,
        .experience h2 {
            font-weight: 600;
            font-size: 24px;
            line-height: 100%;
            border-bottom: 1px solid #00002499;
            padding-bottom: 15px;
            margin-bottom: 22px;
            position: relative;
        }

        .summary h2::before,
        .education h2::before,
        .skills h2::before,
        .experience h2::before {
            content: "";
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 82px;
            height: 3px;
            background: #000024;
        }

        .summary p,
        .skills p,
        .experience .experience_details p {
            font-weight: 400;
            font-size: 16px;
            line-height: 140%;
            color: #000024;
        }

        .education h2 svg,
        .skills h2 svg,
        .experience h2 svg {
            position: absolute;
            bottom: 8px;
        }

        .skills .skills_info {
            display: flex;
            flex-direction: column;
            row-gap: 8px;
        }

        .education .education_info {
            display: flex;
            flex-direction: column;
            row-gap: 20px;
        }

        .education .education_details h4,
        .experience .experience_details h4 {
            font-weight: 600;
            font-size: 17px;
            line-height: 140%;
            color: #000024;
        }

        .education .education_details h4 span {
            font-weight: 400;
        }

        .experience .experience_info {
            display: flex;
            flex-direction: column;
            row-gap: 25px;
        }

        .experience .experience_details h4 {
            margin-bottom: 4px;
        }

        .experience .experience_details ul {
            display: flex;
            flex-direction: column;
            row-gap: 8px;
            list-style: none;
        }

        .experience .experience_details ul li {
            padding-left: 20px;
            position: relative;
        }

        .experience .experience_details ul li::before {
            content: "";
            position: absolute;
            left: 0;
            top: 8px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #000024;
        }

        .experience .experience_details p {
            margin-bottom: 12px;
        }

        .summary,
        .education,
        .skills {
            position: relative;
        }

        .summary::after,
        .education::after,
        .skills::after {
            content: "";
            position: absolute;
            right: -27px;
            top: 0;
            width: 3px;
            height: 70px;
            background: #000024;
        }
    </style>
</head>

<body>
    <div class="resume">
        <div class="header">
            <div class="header_top">
                <div class="header_img">
                    <img src="{{photoUrl}}" alt="{{name}}">
                </div>
                <div class="header_name">
                    <div class="header_icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="150" height="130" viewBox="0 0 233 172"
                            fill="none">
                            <path
                                d="M231.46 117.826C239.063 172.614 196.58 122.667 133.123 131.474C69.6659 140.28 9.26547 204.506 1.66201 149.718C-5.94145 94.9301 11.5278 9.55145 74.9847 0.744889C138.442 -8.06167 223.856 63.0387 231.46 117.826Z"
                                fill="#F9963B" />
                        </svg>
                    </div>
                    <h1>{{name}}</h1>
                    <div class="header_occupation">
                        {{tagline}}
                    </div>
                </div>
            </div>
            <div class="header_bottom">
                <div class="header_info">
                    {{contact}}
                </div>
            </div>
        </div>
        <div class="resume_content">
            <div class="resume_left">
                <div class="summary">
                    <h2>Profile</h2>
                    {{summary}}
                </div>
                <div class="education">
                    <h2>
                        Education
                        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 66 56" fill="none">
                            <path
                                d="M50.9824 24.0088C51.8633 25.5557 52.5186 27.167 52.9482 28.8428C53.3779 30.5186 53.6035 32.248 53.625 34.0312V37.3506L33 47.6953L12.375 37.3506C12.375 36.0615 12.3857 34.8584 12.4072 33.7412C12.4287 32.624 12.5254 31.5391 12.6973 30.4863C12.8691 29.4336 13.127 28.3809 13.4707 27.3281C13.8145 26.2754 14.3301 25.1689 15.0176 24.0088L8.25 20.625V39.542C8.87305 39.7568 9.43164 40.0576 9.92578 40.4443C10.4199 40.8311 10.8604 41.2822 11.2471 41.7979C11.6338 42.3135 11.9131 42.8721 12.085 43.4736C12.2568 44.0752 12.3535 44.709 12.375 45.375V55.6875H0V45.375C0 44.7305 0.0966797 44.1074 0.290039 43.5059C0.483398 42.9043 0.762695 42.335 1.12793 41.7979C1.49316 41.2607 1.92285 40.8096 2.41699 40.4443C2.91113 40.0791 3.48047 39.7783 4.125 39.542V18.5625L0 16.5L33 0L66 16.5L50.9824 24.0088ZM8.25 45.375C8.25 44.8164 8.0459 44.333 7.6377 43.9248C7.22949 43.5166 6.74609 43.3125 6.1875 43.3125C5.62891 43.3125 5.14551 43.5166 4.7373 43.9248C4.3291 44.333 4.125 44.8164 4.125 45.375V51.5625H8.25V45.375ZM9.2168 16.5L33 28.3916L56.7832 16.5L33 4.6084L9.2168 16.5ZM49.5 34.8047C49.5 33.1504 49.3389 31.6143 49.0166 30.1963C48.6943 28.7783 48.125 27.3281 47.3086 25.8457L33 33L18.6914 25.8457C17.9824 27.0918 17.4453 28.4023 17.0801 29.7773C16.7148 31.1523 16.5215 32.5703 16.5 34.0312V34.8047L33 43.0547L49.5 34.8047Z"
                                fill="#000024" fill-opacity="0.2" />
                        </svg>
                    </h2>
                    <div class="education_info">
                        {{education}}
                    </div>
                </div>
                <div class="skills">
                    <h2>
                        Professional Skill
                        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 58 54" fill="none">
                            <path
                                d="M57.75 53.625H41.25V0H57.75V53.625ZM45.375 49.5H53.625V4.125H45.375V49.5ZM37.125 53.625H20.625V16.5H37.125V53.625ZM24.75 49.5H33V20.625H24.75V49.5ZM16.5 53.625H0V28.875H16.5V53.625ZM4.125 49.5H12.375V33H4.125V49.5Z"
                                fill="#000024" fill-opacity="0.11" />
                        </svg>
                    </h2>
                    <div class="skills_info">
                        {{skills}}
                    </div>
                </div>
            </div>
            <div class="resume_right">
                <div class="experience">
                    <h2>
                        Professional Experience
                        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 66 66" fill="none">
                            <path
                                d="M45.375 18.5625C45.375 15.2804 44.0712 12.1328 41.7504 9.81205C39.4297 7.49129 36.2821 6.1875 33 6.1875C29.7179 6.1875 26.5703 7.49129 24.2496 9.81205C21.9288 12.1328 20.625 15.2804 20.625 18.5625M2.0625 35.0625H26.8125M39.1875 35.0625H63.9375M6.1875 18.5625H59.8125C59.8125 18.5625 63.9375 18.5625 63.9375 22.6875V55.6875C63.9375 55.6875 63.9375 59.8125 59.8125 59.8125H6.1875C6.1875 59.8125 2.0625 59.8125 2.0625 55.6875V22.6875C2.0625 22.6875 2.0625 18.5625 6.1875 18.5625Z"
                                stroke="#000024" stroke-opacity="0.2" stroke-width="1.5" stroke-linecap="round"
                                stroke-linejoin="round" />
                            <path
                                d="M26.8125 37.8125C26.8125 39.4535 27.4644 41.0274 28.6248 42.1877C29.7852 43.3481 31.359 44 33 44C34.641 44 36.2148 43.3481 37.3752 42.1877C38.5356 41.0274 39.1875 39.4535 39.1875 37.8125V34.5125C39.1875 32.8715 38.5356 31.2977 37.3752 30.1373C36.2148 28.9769 34.641 28.325 33 28.325C31.359 28.325 29.7852 28.9769 28.6248 30.1373C27.4644 31.2977 26.8125 32.8715 26.8125 34.5125V37.8125Z"
                                stroke="#000024" stroke-opacity="0.2" stroke-width="1.5" stroke-linecap="round"
                                stroke-linejoin="round" />
                        </svg>
                    </h2>
                    <div class="experience_info">
                        {{experience}}
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
