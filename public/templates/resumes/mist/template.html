<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mist Resume</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
        rel="stylesheet">
    <style>
        @page {
            size: A4;
            margin: 0;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body,
        div,
        span,
        applet,
        object,
        iframe,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        p,
        blockquote,
        pre,
        a,
        abbr,
        acronym,
        address,
        big,
        cite,
        code,
        del,
        dfn,
        em,
        font,
        img,
        ins,
        kbd,
        q,
        s,
        samp,
        small,
        strike,
        strong,
        sub,
        sup,
        tt,
        var,
        b,
        u,
        i,
        center,
        dl,
        dt,
        dd,
        ol,
        ul,
        li,
        fieldset,
        form,
        label,
        legend,
        table,
        caption,
        tbody,
        tfoot,
        thead,
        tr,
        th,
        td {
            background: transparent;
            border: 0;
            font-size: 100%;
            margin: 0;
            outline: 0;
            padding: 0;
            vertical-align: baseline;
            text-rendering: optimizeLegibility;
        }

        body {
            margin: 0;
            font-family: "Lato", sans-serif;
        }

        .resume-top-sec {
            width: 794px;
            min-height: 1110px;
            margin: auto;
            margin-top: 10px;
            margin-bottom: 10px;
            background: #fff;
            overflow: hidden;
            padding: 40px 0 0;
            border: 1px solid #000024;
            position: relative;
        }

        .resume-section .resume-top-sec .name h1 {
            font-size: 46px;
            font-weight: 800;
            color: #172B3A;
            line-height: normal;
            margin: 0 0 20px;
        }

        .resume-section .resume-top-sec .name .position {
            background: #B8C8D5;
            width: fit-content;
            padding: 12px 30px;
            border-radius: 60px;
            margin: 0 0 40px;
        }

        .resume-section .resume-top-sec .name .position h6 {
            font-size: 16px;
            font-weight: 600;
            line-height: normal;
            color: #172B3A;
        }

        .resume-section .resume-top-sec .name .row-sec {
            display: flex;
            flex-wrap: wrap;
            position: relative;
            align-items: end;
        }

        .resume-section .resume-top-sec .name .row-sec .left-sec {
            width: 60%;
            padding-right: 20px;
            position: relative;
            padding-left: 40px;
        }

        .resume-section .resume-top-sec .name .row-sec .right-section {
            width: 40%;
            position: relative;
            padding-right: 40px;
            z-index: 9;
        }

        .resume-section .resume-top-sec .name .row-sec .right-section .image {
            text-align: center;
        }

        .resume-section .resume-top-sec .name .row-sec .right-section .image img {
            width: 170px;
            height: 333px;
            border-radius: 160px;
            object-fit: cover;
            object-position: top;
            border: 6px solid #B8C8D5;
        }

        .resume-section .resume-top-sec .name .row-sec .left-sec .profile {
            background: #B8C8D5;
            border-radius: 20px;
            padding: 25px;
            position: relative;
            z-index: 99;
        }

        .resume-section .resume-top-sec .name .row-sec .left-sec .profile h4 {
            font-size: 22px;
            font-weight: 600;
            line-height: normal;
            color: #172B3A;
            margin: 0 0 10px;
        }

        .resume-section .resume-top-sec .name .row-sec .left-sec .profile p {
            font-size: 16px;
            line-height: 24px;
            color: #000;
            font-weight: 400;
            margin: 0 0 20px;
        }

        .resume-section .resume-top-sec .name .row-sec .left-sec .contacts {
            display: flex;
            flex-wrap: wrap;
        }

        .resume-section .resume-top-sec .name .row-sec .left-sec .contacts p {
            width: 60%;
            padding-left: 8px;
            display: flex;
            gap: 10px;
            color: #172B3A;
            font-size: 14px;
            align-items: center;
        }

        .resume-section .resume-top-sec .name .row-sec .left-sec .contacts p:nth-child(odd) {
            width: 40%;
        }

        .resume-section .resume-top-sec .name .name-txt {
            padding: 0 40px;
        }

        .resume-section .resume-top-sec .name .row-sec .left-sec .contacts p a {
            text-decoration: none;
            color: #172B3A;
        }

        .resume-section .resume-top-sec .name .row-sec .left-sec .contacts p svg {
            width: 20px;
            height: 20px;
        }

        .resume-section .resume-top-sec {
            position: relative;
        }

        .resume-section .resume-top-sec .right-svg {
            position: absolute;
            top: 0;
            right: 0;
            width: auto;
            text-align: end;
        }

        .resume-section .resume-top-sec .right-svg svg {
            width: 77%;
            height: 70%;
        }

        .resume-section .resume-top-sec .row-bottom {
            padding: 40px 40px 0;
            display: flex;
            flex-wrap: wrap;
            background: #DFF0F5;
        }

        .resume-section .resume-top-sec .row-bottom .col-left {
            width: 60%;
            padding-right: 10px;
        }

        .resume-section .resume-top-sec .row-bottom .col-right {
            width: 40%;
            padding-left: 20px;
            border-left: 2px solid #B8C8D54F;
        }

        .resume-section .resume-top-sec .row-bottom .col-left .experince h4 {
            font-size: 22px;
            font-weight: 600;
            color: #172B3A;
            margin: 0 0 30px;
            line-height: normal;
        }

        .resume-section .resume-top-sec .row-bottom .col-left .experince .year-position {
            display: flex;
            align-items: flex-end;
            margin: 0 0 15px;
            flex-wrap: wrap;
        }

        .resume-section .resume-top-sec .row-bottom .col-left .experince .year-position .year {
            border: 1px solid #172B3A;
            padding: 4px 12px;
            border-radius: 36px;
            width: 122px;
        }

        .resume-section .resume-top-sec .row-bottom .col-left .experince .year-position .year h6 {
            font-size: 14px;
            font-weight: 600;
            color: #172B3A;
            line-height: normal;
            text-align: center;
        }

        .resume-section .resume-top-sec .row-bottom .col-left .experince .year-position .position {
            padding-left: 15px;
            width: calc(100% - 122px);
        }

        .resume-section .resume-top-sec .row-bottom .col-left .experince .year-position .position h5 {
            font-size: 16px;
            font-weight: 600;
            color: #172B3A;
            line-height: normal;
        }

        .resume-section .resume-top-sec .row-bottom .col-left .experince .details h4 {
            font-size: 18px;
            font-weight: 600;
            color: #172B3A;
            margin: 0 0 20px;
            line-height: normal;
        }

        .resume-section .resume-top-sec .row-bottom .col-left .experince .details p {
            width: calc(100% - 25px);
            padding-left: 10px;
        }

        .resume-section .resume-top-sec .row-bottom .col-left .experince .details p svg {
            width: 20px;
            height: 20px;
        }

        .resume-section .resume-top-sec .row-bottom .col-left .experince .details .icon-txt {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            margin: 0 0 15px;
        }

        .resume-section .resume-top-sec .row-bottom .col-left .experince .details .icon-txt .icon {
            width: 25px;
        }

        .resume-section .resume-top-sec .row-bottom .col-left .experince .details .icon-txt .icon svg {
            width: 20px;
            height: 20px;
        }

        .resume-section .resume-top-sec .row-bottom .col-left .experince .details {
            padding-bottom: 40px;
        }

        .resume-section .resume-top-sec .row-bottom .col-right .education h4,
        .resume-section .resume-top-sec .row-bottom .col-right .skills h4 {
            font-size: 22px;
            font-weight: 600;
            color: #172B3A;
            margin: 0 0 30px;
            line-height: normal;
        }

        .resume-section .resume-top-sec .row-bottom .col-right .education .details .year-position {
            display: flex;
            align-items: flex-start;
            margin: 0 0 15px;
        }

        .resume-section .resume-top-sec .row-bottom .col-right .education .details .year-position .year {
            border: 1px solid #172B3A;
            padding: 4px 12px;
            border-radius: 36px;
            width: 108px;
        }

        .resume-section .resume-top-sec .row-bottom .col-right .education .details .year-position .year h6 {
            font-size: 14px;
            font-weight: 600;
            color: #172B3A;
            line-height: normal;
            text-align: center;
        }

        .resume-section .resume-top-sec .row-bottom .col-right .education .details .year-position .position {
            padding-left: 15px;
            width: calc(100% - 108px);
        }

        .resume-section .resume-top-sec .row-bottom .col-right .education .details .year-position .position h5 {
            font-size: 16px;
            font-weight: 600;
            color: #172B3A;
            line-height: normal;
        }

        .resume-section .resume-top-sec .row-bottom .col-right .education .details h4 {
            font-size: 18px;
            font-weight: 600;
            color: #172B3A;
            margin: 0 0 20px;
            line-height: normal;
        }

        .resume-section .resume-top-sec .row-bottom .col-right .education .details .icon-txt,
        .resume-section .resume-top-sec .row-bottom .col-right .skills .icon-txt {
            display: flex;
            flex-wrap: wrap;
            margin: 0 0 10px;
            align-items: flex-start;
        }

        .resume-section .resume-top-sec .row-bottom .col-right .education .details .icon-txt .icon,
        .resume-section .resume-top-sec .row-bottom .col-right .skills .icon-txt .icon {
            width: 20px;
        }

        .resume-section .resume-top-sec .row-bottom .col-right .education .details .icon-txt p,
        .resume-section .resume-top-sec .row-bottom .col-right .skills .icon-txt p {
            width: calc(100% - 20px);
            padding-left: 10px;
        }

        .resume-section .resume-top-sec .row-bottom .col-right .education .details .icon-txt .icon svg,
        .resume-section .resume-top-sec .row-bottom .col-right .skills .icon-txt .icon svg {
            width: 20px;
            height: 20px;
        }

        .resume-section .resume-top-sec .row-bottom .col-right .education .details {
            margin: 0 0 40px;
        }

        .resume-section .resume-top-sec .name .row-sec .bottom-color {
            background: #DFF0F5;
            width: 100%;
            height: 40%;
            position: absolute;
            bottom: 0;
        }

        .resume-section .resume-top-sec .bg-bottom {
            position: absolute;
            bottom: 60px;
            left: 0;
        }

        .resume-section .resume-top-sec .bg-bottom svg {
            width: 70%;
            height: auto;
        }

        .resume-section .resume-top-sec .row-bottom .col-left .experince {
            position: relative;
            z-index: 9;
        }
    </style>
</head>

                    <rect x="94.5215" y="130.5" width="11" height="9" stroke="#16596D" />
                    <rect x="94.5215" y="146.5" width="11" height="9" stroke="#16596D" />
                    <rect x="94.5215" y="162.5" width="11" height="9" stroke="#16596D" />
                    <rect x="112.521" y="130.5" width="11" height="9" stroke="#16596D" />
                    <rect x="112.521" y="146.5" width="11" height="9" stroke="#16596D" />
                    <rect x="112.521" y="162.5" width="11" height="9" stroke="#16596D" />
                </svg>
            </div>
            <div class="name">
                <div class="name-txt">
                    <h1>{{name}}</h1>
                    <div class="position">
                        {{tagline}}
                    </div>
                </div>
                <div class="row-sec">
                    <div class="left-sec">
                        <div class="profile">
                            <h4>About Me</h4>
                            {{summary}}
                            <div class="contacts">
                                {{contact}}
                            </div>
                        </div>
                    </div>
                    <div class="right-section">
                        <div class="image">
                            <img src="{{photoUrl}}" alt="{{name}}">
                        </div>
                    </div>
                    <div class="bottom-color"></div>
                </div>
            </div>
            <div class="row-bottom">
                <div class="col-left">
                    <div class="experince">
                        <h4>Job & Experience</h4>
                        {{experience}}
                    </div>
                </div>
                <div class="col-right">
                    <div class="education">
                        <h4>Education</h4>
                        {{education}}
                    </div>
                    <div class="skills">
                        <h4>Skills</h4>
                        {{skills}}
                    </div>
                </div>
            </div>

</html>
