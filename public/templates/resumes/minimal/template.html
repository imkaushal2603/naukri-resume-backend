<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
    rel="stylesheet">

  <title>Minimal Resume</title>
  <style>
    @page {
      size: A4;
      margin: 0;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body,
    div,
    span,
    applet,
    object,
    iframe,
    h1,
    h2,
    h3,
    h4,
    h5,
    h6,
    p,
    blockquote,
    pre,
    a,
    abbr,
    acronym,
    address,
    big,
    cite,
    code,
    del,
    dfn,
    em,
    font,
    img,
    ins,
    kbd,
    q,
    s,
    samp,
    small,
    strike,
    strong,
    sub,
    sup,
    tt,
    var,
    b,
    u,
    i,
    center,
    dl,
    dt,
    dd,
    ol,
    ul,
    li,
    fieldset,
    form,
    label,
    legend,
    table,
    caption,
    tbody,
    tfoot,
    thead,
    tr,
    th,
    td {
      background: transparent;
      border: 0;
      font-size: 100%;
      margin: 0;
      outline: 0;
      padding: 0;
      vertical-align: baseline;
      text-rendering: optimizeLegibility;
    }

    body {
      margin: 0;
      font-family: "Lato", sans-serif;
    }

    .resume {
      width: 794px;
      min-height: 1110px;
      margin: 10px auto;
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid #CACACACC;
    }

    .header {
      background: #00000099;
      padding: 40px 25px 45px 25px;
      text-align: center;
    }

    .header h1 {
      font-weight: 700;
      font-size: 34px;
      line-height: 100%;
      color: #FFFFFF;
      margin-bottom: 20px;
      text-align: center;
    }

    .header p {
      font-weight: 400;
      font-size: 18px;
      line-height: 100%;
      color: #FFFFFF;
      display: inline-block;
      text-align: center;
      width: 100%;
      margin-bottom: 30px;
    }

    .header .line {
      max-width: 200px;
      margin: auto;
      background: #fff;
      height: 1px;
      position: relative;
    }

    .header .line::after {
      content: "";
      background: #D9D9D9;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .resume_content {
      display: flex;
      flex-wrap: wrap;
    }

    .resume_left {
      width: 60%;
      padding: 20px;
    }

    .resume_right {
      width: 40%;
      background: #D9D9D933;
      padding: 20px;
    }

    .resume_info {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .resume_icon {
      line-height: 0;
      width: 45px;
    }

    .resume_title {
      width: calc(100% - 55px);
      position: relative;
    }

    .resume_title::after {
      content: "";
      background: #666666;
      height: 2px;
      width: 100%;
      position: absolute;
      top: 50%;
    }

    .resume_title h2 {
      font-weight: 700;
      font-size: 22px;
      line-height: 100%;
      color: #000024;
      position: relative;
      z-index: 1;
      background: #fff;
      width: fit-content;
      padding-right: 20px;
    }

    .summary p {
      font-weight: 400;
      font-size: 15px;
      line-height: 150%;
      color: #000024;
      display: inline-block;
      margin-bottom: 30px;
    }

    .education .education_details h4,
    .experience .experience_details h4 {
      font-weight: 600;
      font-size: 17px;
      line-height: 100%;
      color: #000000;
      margin-bottom: 10px;
    }

    .education .education_details p,
    .experience .experience_details p {
      font-weight: 400;
      font-size: 16px;
      line-height: 100%;
      color: #000024;
      display: inline-block;
      margin-bottom: 20px;
    }

    .education .education_info,
    .experience .experience_details {
      padding-left: 50px;
      position: relative;
    }

    .education .education_info::before,
    .experience .experience_details::before {
      content: "";
      background: #D9D9D9;
      height: calc(100% - 20px);
      width: 4px;
      position: absolute;
      left: 21px;
    }

    .education .education_info::after,
    .experience .experience_details::after {
      content: "";
      width: 22px;
      height: 22px;
      background: #D9D9D9;
      position: absolute;
      top: 0;
      border-radius: 50%;
      left: 12px;
    }

    .experience .experience_details ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      row-gap: 8px;
      margin-bottom: 30px;
      padding-bottom: 30px;
      border-bottom: 1px solid #666666;
    }

    .experience .experience_details ul li {
      font-weight: 400;
      font-size: 15px;
      line-height: 130%;
      display: inline-block;
      color: #000024;
      padding-left: 20px;
      position: relative;
    }

    .experience .experience_details ul li::before {
      content: "";
      background-color: #000024;
      border-radius: 50%;
      width: 8px;
      height: 8px;
      position: absolute;
      left: 0;
      top: 7px;
    }

    .experience .experience_details:last-child ul {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: none;
    }

    .resume_right .resume_title h2 {
      background: #f7f7f7;
    }

    .contact {
      margin-bottom: 30px;
    }

    .contact .contact_info {
      display: flex;
      flex-direction: column;
      row-gap: 12px;
    }

    .contact .contact_details {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      align-items: center;
    }

    .contact .contact_icon {
      width: 20px;
      text-align: center;
      line-height: 0;
    }

    .contact .contact_content {
      width: calc(100% - 40px);
    }

    .contact a {
      font-size: 15px;
      text-decoration: none;
      color: #000024;
      line-height: normal;
      display: inline-block;
    }

    .skills .skils_info {
      display: flex;
      flex-direction: column;
      row-gap: 8px;
    }

    .skills p {
      font-size: 16px;
      line-height: 100%;
      color: #000000;
      display: inline-block;
      padding-left: 20px;
      position: relative;
    }

    .skills p::before {
      content: "";
      background-color: #000024;
      border-radius: 50%;
      width: 8px;
      height: 8px;
      position: absolute;
      left: 0;
      top: 6px;
    }

    .experience_details,
    .skills_details {
      page-break-inside: avoid;
      break-inside: avoid;
    }
  </style>
</head>
