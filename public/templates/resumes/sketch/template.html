<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sketch Resume</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <style>
        @page {
            size: A4;
            margin: 0;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body,
        div,
        span,
        applet,
        object,
        iframe,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        p,
        blockquote,
        pre,
        a,
        abbr,
        acronym,
        address,
        big,
        cite,
        code,
        del,
        dfn,
        em,
        font,
        img,
        ins,
        kbd,
        q,
        s,
        samp,
        small,
        strike,
        strong,
        sub,
        sup,
        tt,
        var,
        b,
        u,
        i,
        center,
        dl,
        dt,
        dd,
        ol,
        ul,
        li,
        fieldset,
        form,
        label,
        legend,
        table,
        caption,
        tbody,
        tfoot,
        thead,
        tr,
        th,
        td {
            background: transparent;
            border: 0;
            font-size: 100%;
            margin: 0;
            outline: 0;
            padding: 0;
            vertical-align: baseline;
            text-rendering: optimizeLegibility;
        }

        body {
            margin: 0;
            font-family: "Inter", sans-serif;
        }

        .resume {
            width: 794px;
            min-height: 1110px;
            margin: auto;
            margin-top: 10px;
            margin-bottom: 10px;
            background: #fff;
            overflow: hidden;
            padding: 35px;
            border: 1px solid #DBE0FE;
            position: relative;
            border-radius: 8px;
        }

        .resume_img {
            position: absolute;
            right: 0;
            bottom: 0;
            line-height: 0;
        }

        .header_top {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            margin-bottom: 30px;
        }

        .header_top .header_left {
            width: calc(60% - 15px);
        }

        .header_top .header_right {
            width: 40%;
            display: flex;
            justify-content: end;
        }

        .header_top h1 {
            font-weight: 500;
            font-size: 52px;
            line-height: 100%;
            color: #000024;
        }

        .header_top h4 {
            background: #DBE0FE;
            font-weight: 500;
            font-style: Italic;
            font-size: 20px;
            line-height: 100%;
            color: #000024;
            border-radius: 30px;
            padding: 10px 30px;
            text-align: center;
            width: fit-content;
        }

        .header_bottom {
            display: flex;
            flex-direction: column;
            row-gap: 40px;
        }

        .summary h2 {
            font-weight: 500;
            font-size: 24px;
            line-height: 100%;
            color: #000024;
            margin-bottom: 16px;
        }

        .summary p {
            font-weight: 400;
            font-size: 16px;
            line-height: 140%;
            display: inline-block;
            color: #000024;
        }

        .contact h2,
        .education h2,
        .skills h2,
        .experience h2 {
            background: #DBE0FE;
            width: fit-content;
            padding: 15px 70px 15px 15px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 18px;
            line-height: 100%;
            color: #000024;
        }

        .contact .contact_info {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            margin-top: 20px;
            align-items: center;
            row-gap: 15px;
        }

        .contact .contact_details a,
        .contact .contact_details p {
            font-weight: 500;
            font-size: 16px;
            line-height: 100%;
            color: #000024;
            text-decoration: none;
        }

        .resume_content {
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            margin-top: 80px;
            position: relative;
            z-index: 1;
        }

        .resume_left,
        .resume_right {
            width: calc(50% - 20px);
        }

        .education,
        .skills,
        .experience {
            border: 2px solid #DBE0FE;
            border-radius: 20px;
            padding: 45px 20px 20px;
            position: relative;
        }

        .resume_left {
            display: flex;
            flex-direction: column;
            row-gap: 60px;
        }

        .education h2,
        .skills h2,
        .experience h2 {
            position: absolute;
            top: -25px;
        }

        .skills .skills_info {
            display: flex;
            flex-direction: column;
            row-gap: 10px;
        }

        .skills .skills_details p {
            font-weight: 500;
            font-size: 16px;
            line-height: normal;
            color: #000000;
        }

        .education .education_info,
        .experience .experience_info {
            display: flex;
            flex-direction: column;
            row-gap: 25px;
        }

        .education .education_details h4,
        .experience .experience_details h4 {
            font-weight: 600;
            font-size: 18px;
            line-height: 140%;
            color: #000000;
            margin-bottom: 6px;
        }

        .education .education_details p,
        .experience .experience_details p {
            font-weight: 500;
            font-size: 17px;
            line-height: 140%;
            color: #000000;
            display: inline-block;
        }

        .experience .experience_details p {
            margin-bottom: 12px;
        }

        .experience .experience_details ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            row-gap: 8px;
        }

        .experience .experience_details ul li {
            padding-left: 20px;
            font-weight: 400;
            font-size: 15px;
            line-height: 140%;
            color: #000000;
            display: inline-block;
            position: relative;
        }

        .experience .experience_details ul li::before {
            content: "";
            position: absolute;
            background: #000;
            left: 0;
            top: 8px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
    </style>
</head>

        <div class="header">
            <div class="header_top">
                <div class="header_left">
                    <h1>{{name}}</h1>
                </div>
                <div class="header_right">
                    {{tagline}}
                </div>
            </div>
            <div class="header_bottom">
                <div class="summary">
                    <h2>Profile</h2>
                    {{summary}}
                </div>
                <div class="contact">
                    <h2>Contacts Details</h2>
                    <div class="contact_info">
                        {{contact}}
                    </div>
                </div>
            </div>
        </div>
        <div class="resume_content">
            <div class="resume_left">
                <div class="education">
                    <h2>Education</h2>
                    <div class="education_info">
                        {{education}}
                    </div>
                </div>
                <div class="skills">
                    <h2>Skills</h2>
                    <div class="skills_info">
                        {{skills}}
                    </div>
                </div>
            </div>
            <div class="resume_right">
                <div class="experience">
                    <h2>Experience</h2>
                    <div class="experience_info">
                        {{experience}}
                    </div>
                </div>
            </div>
        </div>

</html>
