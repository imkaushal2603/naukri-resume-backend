<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Willow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
        rel="stylesheet">
    <style>
        @page {
            size: A4;
            margin: 0;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body,
        div,
        span,
        applet,
        object,
        iframe,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        p,
        blockquote,
        pre,
        a,
        abbr,
        acronym,
        address,
        big,
        cite,
        code,
        del,
        dfn,
        em,
        font,
        img,
        ins,
        kbd,
        q,
        s,
        samp,
        small,
        strike,
        strong,
        sub,
        sup,
        tt,
        var,
        b,
        u,
        i,
        center,
        dl,
        dt,
        dd,
        ol,
        ul,
        li,
        fieldset,
        form,
        label,
        legend,
        table,
        caption,
        tbody,
        tfoot,
        thead,
        tr,
        th,
        td {
            background: transparent;
            border: 0;
            font-size: 100%;
            margin: 0;
            outline: 0;
            padding: 0;
            vertical-align: baseline;
            text-rendering: optimizeLegibility;
        }

        body {
            margin: 0;
            font-family: "Lato", sans-serif;
        }

        .resume-top-sec {
            width: 794px;
            min-height: 1110px;
            margin: auto;
            margin-top: 10px;
            margin-bottom: 10px;
            background: #fff;
            overflow: hidden;
            padding: 40px 40px;
            border: 1px solid #000024;
            position: relative;
        }

        .resume-section .resume-top-sec .contacts-name {
            display: flex;
            flex-wrap: wrap;
            padding-bottom: 50px;
            position: relative;
            z-index: 1;
        }

        .resume-section .resume-top-sec .contacts-name .left-sec {
            width: 50%;
            padding-right: 20px;
            padding-top: 40px;
        }

        .resume-section .resume-top-sec .contacts-name .right-sec {
            width: 50%;
            text-align: end;
            padding-left: 20px;
        }

        .resume-section .resume-top-sec .contacts-name .left-sec .contacts h4,
        .resume-section .resume-top-sec .profile-summary h4 {
            font-size: 22px;
            font-weight: 600;
            font-style: italic;
            margin: 0 0 15px;
            letter-spacing: 10%;
        }

        .resume-section .resume-top-sec .contacts-name .left-sec .contacts p a,
        .resume-section .resume-top-sec .contacts-name .left-sec .contacts p {
            font-size: 18px;
            text-decoration: none;
            font-weight: 400;
            color: #000;
            font-style: italic;
            margin: 0 0 10px;
            display: block;
        }

        .resume-section .resume-top-sec .contacts-name .right-sec .name h1 {
            font-size: 34px;
            font-weight: 700;
            font-style: italic;
            margin: 0 0 15px;
            letter-spacing: 10%;
        }

        .resume-section .resume-top-sec .contacts-name .right-sec .name h6 {
            font-size: 17px;
            font-weight: 600;
            font-style: italic;
            margin: 0 0 15px;
            letter-spacing: 10%;
        }

        .resume-section .resume-top-sec .profile-summary p {
            font-size: 16px;
            font-weight: 400;
            font-style: italic;
            line-height: 24px;
            letter-spacing: 10%;
        }

        .resume-section .resume-top-sec {
            position: relative;
        }

        .resume-section .resume-top-sec .bg-svg {
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            text-align: end;
        }

        .resume-section .resume-top-sec .bg-svg svg {
            width: 86%;
            height: 50%;
            margin: 0 0 0 auto;
        }

        .resume-section .resume-top-sec .profile-summary {
            position: relative;
            z-index: 1;
        }

        .resume-section .resume-top-sec .row-sec {
            display: flex;
            flex-wrap: wrap;
            padding-top: 60px;
        }

        .resume-section .resume-top-sec .row-sec .column-left {
            width: 50%;
            padding-right: 20px;
        }

        .resume-section .resume-top-sec .row-sec .column-left .educations h4,
        .resume-section .resume-top-sec .row-sec .column-left .skills h4 {
            font-size: 22px;
            font-weight: 600;
            font-style: italic;
            margin: 0 0 15px;
            letter-spacing: 10%;
        }

        .resume-section .resume-top-sec .row-sec .column-left .educations p,
        .resume-section .resume-top-sec .row-sec .column-left .skills p {
            font-size: 18px;
            font-weight: 500;
            font-style: italic;
            letter-spacing: 10%;
            margin: 0 0 10px;
            line-height: 150%;
        }

        .resume-section .resume-top-sec .row-sec .column-left .skills {
            padding-top: 40px;
            position: relative;
            z-index: 9;
        }

        .resume-section .resume-top-sec .row-sec .column-left .educations {
            position: relative;
            z-index: 9;
        }

        .resume-section .resume-top-sec .row-sec .column-right {
            width: 50%;
            padding-left: 20px;
        }

        .resume-section .resume-top-sec .row-sec .column-right .experience h4 {
            font-size: 22px;
            font-weight: 600;
            font-style: italic;
            margin: 0 0 15px;
            letter-spacing: 10%;
        }

        .resume-section .resume-top-sec .row-sec .column-right .experience .details {
            padding-bottom: 30px;
            position: relative;
            z-index: 9;
        }

        .resume-section .resume-top-sec .row-sec .column-right .experience .details h6 {
            font-size: 18px;
            line-height: 26px;
            margin: 0 0 10px;
            letter-spacing: 10%;
            font-style: italic;
        }

        .resume-section .resume-top-sec .row-sec .column-right .experience .details p {
            font-size: 16px;
            line-height: 24px;
            font-weight: 400;
            font-style: italic;
            margin: 0 0 10px;
        }

        .resume-section .resume-top-sec .svg.bg {
            position: absolute;
            bottom: 0;
            left: 0;
            display: flex;
            align-items: end;
            width: 100%;
            height: 100%;
        }

        .resume-section .resume-top-sec .svg.bg svg {
            width: 70%;
            height: auto;
        }
    </style>
</head>

<body>
    <div class="resume-section">
        <div class="resume-top-sec">
            <div class="bg-svg">
                <svg xmlns="http://www.w3.org/2000/svg" width="1152" height="618" viewBox="0 0 1152 618" fill="none">
                    <path
                        d="M1784.5 40.5C1784.5 359.444 1388.27 618 899.5 618C410.728 618 0 164.444 0 -154.5C0 -473.444 410.728 -537 899.5 -537C1388.27 -537 1784.5 -278.444 1784.5 40.5Z"
                        fill="#E5EFBC" />
                </svg>
            </div>
            <div class="contacts-name">
                <div class="left-sec">
                    <div class="contacts">
                        <h4>Contacts</h4>
                        {{contact}}
                    </div>
                </div>
                <div class="right-sec">
                    <div class="name">
                        <h1>{{name}}</h1>
                        {{tagline}}
                    </div>
                </div>
            </div>
            <div class="profile-summary">
                <h4>Profile</h4>
                {{summary}}
            </div>
            <div class="row-sec">
                <div class="column-left">
                    <div class="educations">
                        <h4>Education</h4>
                        {{education}}
                    </div>
                    <div class="skills">
                        <h4>Skills</h4>
                        {{skills}}
                    </div>
                </div>
                <div class="column-right">
                    <div class="experience">
                        <h4>Work Experience</h4>
                        {{experience}}
                    </div>
                </div>
            </div>
            <div class="svg bg">
                <svg xmlns="http://www.w3.org/2000/svg" width="818" height="1347" viewBox="0 0 818 1347" fill="none">
                    <circle cx="126.5" cy="691.5" r="691.5" fill="#EEE5EA" />
                </svg>
            </div>
        </div>
    </div>
</body>

</html>
