<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
        rel="stylesheet">
    <title>Amber Resume</title>
    <style>
        @page {
            size: A4;
            margin: 0;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body,
        div,
        span,
        applet,
        object,
        iframe,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        p,
        blockquote,
        pre,
        a,
        abbr,
        acronym,
        address,
        big,
        cite,
        code,
        del,
        dfn,
        em,
        font,
        img,
        ins,
        kbd,
        q,
        s,
        samp,
        small,
        strike,
        strong,
        sub,
        sup,
        tt,
        var,
        b,
        u,
        i,
        center,
        dl,
        dt,
        dd,
        ol,
        ul,
        li,
        fieldset,
        form,
        label,
        legend,
        table,
        caption,
        tbody,
        tfoot,
        thead,
        tr,
        th,
        td {
            background: transparent;
            border: 0;
            font-size: 100%;
            margin: 0;
            outline: 0;
            padding: 0;
            vertical-align: baseline;
            text-rendering: optimizeLegibility;
        }

        body {
            margin: 0;
            font-family: "Lato", sans-serif;
        }

        .resume {
            width: 794px;
            min-height: 1110px;
            margin: 10px auto;
            background: #F4F4F4;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #e5c05885;
        }

        .header {
            display: flex;
            flex-direction: column;
            row-gap: 40px;
        }

        .header .header_top {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            position: relative;
            margin-right: 50px;
        }

        .header .header_names {
            writing-mode: vertical-lr;
            transform: rotate(180deg);
            white-space: nowrap;
            border-left: 2px solid #000024;
            padding: 8px 15px 50px;
            z-index: 1;
        }

        .header .header_names h2 {
            font-weight: 500;
            font-style: Italic;
            font-size: 20px;
            line-height: 100%;
            letter-spacing: 24%;
            color: #000024;
        }

        .header .header_image {
            padding: 40px 15px 40px 0;
            line-height: 0;
        }

        .header .header_occupation {
            position: absolute;
            bottom: 40px;
            width: 100%;
            left: 0;
            background: #E5C058E5;
            text-align: end;
            padding: 15px 25px;
        }

        .header .header_occupation h4 {
            font-weight: 700;
            font-style: Italic;
            font-size: 14px;
            line-height: 100%;
            letter-spacing: 22%;
            color: #FFFFFF;
            max-width: 280px;
            margin: 0 0 0 auto;
        }

        .header .header_image img {
            height: 220px;
            object-fit: cover;
            width: 220px;
            object-position: top;
        }

        .header .header_name {
            width: calc(100% - 347px);
            padding-right: 20px;
            display: flex;
            align-items: end;
        }

        .header .header_name h1 {
            font-weight: 500;
            font-size: 50px;
            line-height: 100%;
            letter-spacing: 10%;
            color: #000024;
            z-index: 1;
            position: relative;
            word-break: break-word;
            margin-bottom: 20px;
        }

        .header_bottom {
            padding: 0 50px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header_bottom .header_left {
            width: 40%;
            border-left: 2px solid #000024;
            padding-left: 15px;
        }

        .header_bottom .header_right {
            width: calc(60% - 20px);
        }

        .header_bottom .header_info {
            display: flex;
            flex-direction: column;
            row-gap: 10px;
        }

        .header_bottom .header_details {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header_bottom .header_details a,
        .header_bottom .header_details p {
            display: inline-block;
            text-decoration: none;
            font-weight: 400;
            font-size: 16px;
            line-height: 100%;
            color: #000000;
            word-wrap: anywhere;
        }

        .header .summary h2,
        .resume_content .skills h2,
        .resume_content .education h2,
        .resume_content .experience h2 {
            font-weight: 600;
            font-size: 26px;
            line-height: 100%;
            letter-spacing: 20%;
            color: #000024;
            margin-bottom: 20px;
        }

        .header .summary p {
            font-weight: 400;
            font-size: 16px;
            line-height: 140%;
            color: #000024E5;
            display: inline-block;
            margin-bottom: 15px;
            position: relative;
            padding: 0 0 20px 25px;
        }

        .header .summary p::before {
            content: "";
            height: 100%;
            width: 1px;
            background: #000024;
            left: 0;
            top: 0;
            position: absolute;
        }

        .header .summary p::after {
            content: "";
            height: 100%;
            width: 2px;
            background: #000024;
            left: 5px;
            top: 0;
            position: absolute;
        }

        .resume_content {
            margin-top: 50px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding: 0 50px 50px;
        }

        .resume_content .resume_left {
            width: 40%;
            display: flex;
            flex-direction: column;
            row-gap: 40px;
        }

        .resume_content .resume_right {
            width: calc(60% - 20px);
        }

        .resume_content .skills,
        .resume_content .education {
            border-left: 2px solid #000024;
            padding-left: 15px;
        }

        .resume_content .skills_details p,
        .resume_content .experience_details ul li {
            font-weight: 400;
            font-size: 16px;
            line-height: 140%;
            color: #000024E5;
            display: inline-block;
            padding-left: 20px;
            position: relative;
            padding-bottom: 8px;
        }

        .resume_content .skills_details p::before,
        .resume_content .experience_details ul li::before {
            content: "";
            position: absolute;
            background: #000024;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            left: 0;
            top: 8px;
        }

        .resume_content .skills_details p::after,
        .resume_content .experience_details ul li::after {
            content: "";
            position: absolute;
            width: 1px;
            height: 100%;
            background: #000024;
            left: 3.5px;
            top: 8px;
        }

        .resume_content .skills_details:last-child p::after,
        .resume_content .experience_details ul li:last-child::after {
            display: none;
        }

        .resume_content .skills_details:last-child p,
        .resume_content .experience_details ul li:last-child {
            padding-bottom: 0;
        }

        .resume_content .education_info {
            display: flex;
            flex-direction: column;
            row-gap: 25px;
        }

        .resume_content .education_details h4,
        .resume_content .experience_details h4 {
            font-weight: 600;
            font-size: 17px;
            line-height: 140%;
            color: #000000;
            margin-bottom: 10px;
        }

        .resume_content .education_details p,
        .resume_content .experience_details p {
            font-weight: 400;
            font-size: 16px;
            line-height: 140%;
            color: #000024E5;
            display: inline-block;
        }

        .resume_content .experience_info {
            display: flex;
            flex-direction: column;
            row-gap: 25px;
        }

        .resume_content .experience_details p {
            margin-bottom: 10px;
        }

        .resume_content .experience_details ul {
            list-style: none;
        }

        .header .summary h2 {
            padding-left: 25px;
        }

        .header_bottom .header_details svg {
            min-width: 30px;
        }
    </style>
</head>

<body>
    <div class="resume">
        <div class="header">
            <div class="header_top">
                <div class="header_names">
                    <h2>{{name}}</h2>
                </div>
                <div class="header_name">
                    <h1>{{name}}</h1>
                </div>
                <div class="header_image">
                    <img src="{{photoUrl}}" alt="{{name}}" />
                </div>
                <div class="header_occupation">
                    {{tagline}}
                </div>
            </div>
            <div class="header_bottom">
                <div class="header_left">
                    <div class="header_info">
                        {{contact}}
                    </div>
                </div>
                <div class="header_right">
                    <div class="summary">
                        <h2>PROFILE</h2>
                        {{summary}}
                    </div>
                </div>
            </div>
        </div>
        <div class="resume_content">
            <div class="resume_left">
                <div class="skills">
                    <h2>SKILLS</h2>
                    <div class="skills_info">
                        {{skills}}
                    </div>
                </div>
                <div class="education">
                    <h2>EDUCATION</h2>
                    <div class="education_info">
                        {{education}}
                    </div>
                </div>
            </div>
            <div class="resume_right">
                <div class="experience">
                    <h2>Experience</h2>
                    <div class="experience_info">
                        {{experience}}
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
